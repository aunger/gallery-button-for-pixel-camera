# Findings that scripts/ci/audit_requirements.py tolerates, one entry per
# advisory ID per lock (issue #804).
#
# An entry says "this finding is real, and here is why it does not block this
# repo". It is not a dismissal of the advisory; it is a record of a reachability
# argument, and it has to carry enough to re-check that argument later:
#
#   id           any ID pip-audit reports for the advisory, primary or alias
#                (PYSEC-..., GHSA-..., CVE-...). Which one pip-audit reports as
#                primary can change between runs (issue #1217), so an entry
#                matches through aliases too. One finding may be matched by
#                only one entry; a second entry naming another of its IDs fails
#                the audit.
#   package      the distribution the advisory is against; a mismatch fails the audit.
#   reason       why the finding does not apply to this repo's usage.
#   remove_when  what would have to become true for this entry to be deleted.
#
# One entry covers its advisory for its package in its lock at every version the
# lock pins that package at. A universal lock can carry one name at two versions
# under complementary markers (`rpds-py` did), and the argument an entry records
# is about how this repo uses the package, not about a version, so a per-version
# entry would be noise. Both findings still appear in the report; only the
# justification is shared.
#
# What has to be unique within a lock is the (package, id) pair, not the id. One
# advisory can hit two packages pinned in the same lock, and reachability is
# argued per package, so that case takes one entry each, with the same id and
# different reasons.
#
# Two rules make the list self-cleaning rather than a place things go to die:
#
# 1. An entry is scoped to one lock. A finding that is unreachable in the
#    semgrep lock is not automatically unreachable in the script-runtime lock,
#    so the same ID has to be justified again to be ignored again.
# 2. An entry that stops matching a reported finding FAILS the audit. That
#    usually means an upstream cap lifted or the package was dropped, which is
#    exactly when the reasoning below deserves re-reading rather than quiet
#    deletion. Issue #788's `click` case is the cautionary tale: semgrep
#    relaxed its `click~=8.1.8` cap and nothing was watching, so a fixable HIGH
#    was written off as unfixable for two weeks.
#
# This list is not the Dependabot dismissal list and is not kept in sync with
# it. pip-audit reports from PyPI/OSV/PYSEC and GitHub alerts from its own
# advisory database; their coverage differs (again per #788: OSV and PYSEC
# carried CVE-2026-7246 against click 8.1.8 while GitHub did not alert on it).
