id = "CVE-2026-103001"
package = "pyjwt"
reason = """
CVE-2026-103001 / GHSA-gvp8-978c-rx2q: `jwt.decode` with a falsy `verify_signature` \
writes `verify_exp=False` and the other claim switches into the caller's `options` \
dict, so a later fully verified call that reuses the same dict skips its claim \
checks. Affects only code that reuses one `options` dict across decode calls. \
pyjwt's only caller here is the `semgrep mcp` token verifier (see above), which \
passes a fresh `options` literal on each call, and this repo runs only `semgrep \
scan`."""
remove_when = """
semgrep relaxes its `pyjwt[crypto]~=2.13.0` requirement to admit 2.14.0 or later, \
or this repo starts running `semgrep mcp`. The advisory names no fixed version, but \
records 2.13.0 as the last affected one. In the first case, regenerating the lock \
clears the finding; in the second, the reachability argument no longer holds and \
the pin has to be forced or semgrep dropped."""
