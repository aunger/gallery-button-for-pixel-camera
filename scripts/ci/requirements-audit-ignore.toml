# Findings that scripts/ci/audit_requirements.py tolerates, one entry per
# advisory ID per lock (issue #804).
#
# An entry says "this finding is real, and here is why it does not block this
# repo". It is not a dismissal of the advisory; it is a record of a reachability
# argument, and it has to carry enough to re-check that argument later:
#
#   id           any ID pip-audit reports for the advisory, primary or alias
#                (PYSEC-..., GHSA-..., CVE-...). Which one pip-audit reports as
#                primary can change between runs (issue #1217), so an entry
#                matches through aliases too. One finding may be matched by
#                only one entry; a second entry naming another of its IDs fails
#                the audit.
#   package      the distribution the advisory is against; a mismatch fails the audit.
#   reason       why the finding does not apply to this repo's usage.
#   remove_when  what would have to become true for this entry to be deleted.
#
# One entry covers its advisory for its package in its lock at every version the
# lock pins that package at. A universal lock can carry one name at two versions
# under complementary markers (`rpds-py` did), and the argument an entry records
# is about how this repo uses the package, not about a version, so a per-version
# entry would be noise. Both findings still appear in the report; only the
# justification is shared.
#
# What has to be unique within a lock is the (package, id) pair, not the id. One
# advisory can hit two packages pinned in the same lock, and reachability is
# argued per package, so that case takes one entry each, with the same id and
# different reasons.
#
# Two rules make the list self-cleaning rather than a place things go to die:
#
# 1. An entry is scoped to one lock. A finding that is unreachable in the
#    semgrep lock is not automatically unreachable in the script-runtime lock,
#    so the same ID has to be justified again to be ignored again.
# 2. An entry that stops matching a reported finding FAILS the audit. That
#    usually means an upstream cap lifted or the package was dropped, which is
#    exactly when the reasoning below deserves re-reading rather than quiet
#    deletion. Issue #788's `click` case is the cautionary tale: semgrep
#    relaxed its `click~=8.1.8` cap and nothing was watching, so a fixable HIGH
#    was written off as unfixable for two weeks.
#
# This list is not the Dependabot dismissal list and is not kept in sync with
# it. pip-audit reports from PyPI/OSV/PYSEC and GitHub alerts from its own
# advisory database; their coverage differs (again per #788: OSV and PYSEC
# carried CVE-2026-7246 against click 8.1.8 while GitHub did not alert on it).

# ---------------------------------------------------------------------------
# semgrep's transitive `pyjwt` pin. See issues #1189 and #1211.
#
# semgrep declares `pyjwt[crypto]~=2.13.0` in every release through 1.178.0, so
# regenerating this lock cannot reach 2.14.0, which fixes most of the advisories
# below. CVE-2026-101918 is fixed only in 2.15.0, so its entry outlives the rest
# if semgrep's requirement moves to `~=2.14.0`.
#
# Every advisory below is a bug in verifying tokens (`jwt.decode`, PyJWK and
# PyJWKSet key parsing, the HMAC key guard) or in `PyJWKClient` fetching a JWKS.
# semgrep calls pyjwt in one place: IntrospectionTokenVerifier in
# semgrep/mcp/utilities/token_verifier.py, which builds a PyJWKClient and calls
# `jwt.decode` on bearer tokens sent to semgrep's MCP server. Only
# `setup_mcp_server` in semgrep/commands/mcp.py constructs it, so only `semgrep
# mcp` reaches it. `mcp` itself only calls `jwt.encode`, in a client-credentials
# extension semgrep never imports. `jwt` is imported on every scan (cli.py
# imports commands/mcp.py, which imports token_verifier.py, which imports jwt),
# but `semgrep scan`, this repo's only semgrep invocation, never calls into it,
# and nothing in this repo runs `semgrep mcp`.
# ---------------------------------------------------------------------------

[[ignore."scripts/ci/requirements-semgrep.txt"]]
id = "CVE-2026-101917"
package = "pyjwt"
reason = """
CVE-2026-101917 / GHSA-2gx3-rcp4-g85q: PyJWKClient re-fetches the JWKS for every \
unknown `kid`, which it reads from the unverified token header, so unauthenticated \
requests amplify into JWKS fetches. Affects only an application that verifies tokens \
through PyJWKClient. pyjwt's only caller here is the `semgrep mcp` token verifier \
(see above), and this repo runs only `semgrep scan`."""
remove_when = """
semgrep relaxes its `pyjwt[crypto]~=2.13.0` requirement to admit 2.14.0 or later, \
or this repo starts running `semgrep mcp`. In the first case, regenerating the lock \
clears the finding; in the second, the reachability argument no longer holds and \
the pin has to be forced or semgrep dropped."""

[[ignore."scripts/ci/requirements-semgrep.txt"]]
id = "CVE-2026-101918"
package = "pyjwt"
reason = """
CVE-2026-101918 / GHSA-42vr-xj54-vc7v: a deeply nested token payload makes \
`json.loads` raise a RecursionError that escapes `jwt.decode` as neither a \
DecodeError nor any PyJWTError, on the paths that parse the payload before \
verifying the signature (`PyJWKClient.get_signing_key_from_jwt`, \
`verify_signature=False`); a deeply nested JWKS response does the same in \
`PyJWKClient.fetch_data`. Affects only code that decodes untrusted tokens through \
those paths. pyjwt's only caller here is the `semgrep mcp` token verifier (see \
above), and this repo runs only `semgrep scan`."""
remove_when = """
semgrep relaxes its `pyjwt[crypto]~=2.13.0` requirement to admit 2.15.0 or later, \
or this repo starts running `semgrep mcp`. 2.14.0 does not fix this advisory. In the \
first case, regenerating the lock clears the finding; in the second, the \
reachability argument no longer holds and the pin has to be forced or semgrep \
dropped."""

