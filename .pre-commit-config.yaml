repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        # flowmark (below) is the authoritative formatter for Markdown and
        # always renders a blank line inside a multi-paragraph blockquote as
        # "> " (a trailing space after the ">"); this is how flowmark keeps
        # the line a valid blockquote continuation. Without this exclude,
        # this hook strips that trailing space right back out on every run,
        # and the two hooks fight forever on any file with such a blockquote.
        exclude: '\.(md|markdown)$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f0b5944bef86f50d875305821a0ab0d8c601e465 # v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        language: system
        entry: ktlint
        args: [--format]
        files: '\.(kt|kts)$'
      - id: flowmark
        name: flowmark
        language: system
        entry: flowmark
        args: [--inplace, --nobackup, --force-exclude]
        files: '\.(md|markdown)$'
