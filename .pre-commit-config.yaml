repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06 # v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        language: system
        entry: ktlint
        args: [--format]
        files: '\.(kt|kts)$'
      - id: mdformat
        name: mdformat
        language: system
        entry: mdformat
        # --wrap keep preserves this repo's intentional one-sentence-per-line
        # prose (see .claude/rules/prose-style.md) instead of rewrapping it.
        # --number keeps ordered-list numbering sequential (1, 2, 3, ...)
        # instead of mdformat's own default of repeating "1." for every item.
        # Extensions (frontmatter, gfm tables) are picked up automatically
        # from whatever is pip-installed; see .claude/hooks/session-start.sh.
        args: [--wrap, keep, --number]
        files: '\.md$'
