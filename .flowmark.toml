# Flowmark configuration for this repo's Markdown formatting.
#
# These settings map to the rules in .claude/rules/prose-style.md:
#
# - `semantic` enables sentence-boundary line wrapping, i.e. "split prose at
#   sentence breaks" (the "Word wrap in Markdown, etc" rule).
# - `width` is set very large rather than left at the 88-column default so
#   `semantic` is the sole determinant of line breaks: a sentence only ever
#   breaks at its end, never mid-sentence at a width limit.
#   Do NOT set this to 0 instead: 0 has a different, special meaning here.
#   `line_wrap_by_sentence()` in Flowmark's own source
#   (linewrapping/line_wrappers.py) short-circuits on `width <= 0` *before*
#   it ever calls the sentence splitter, collapsing an entire paragraph
#   (every sentence in it) onto a single line. A large positive width goes
#   through the normal sentence-splitting path and simply never triggers
#   the width check, which is the behavior we actually want.
# - `cleanups` enables (safe) structural fixes, such as unbolding headings
#   whose entire text is bold. It does not touch punctuation.
# - `smartquotes` and `ellipses` are deliberately left disabled: enabling
#   either would convert straight quotes or a literal "..." into curly or
#   typographic characters, which is the opposite of the "Avoid angle quote,
#   em-dash, and ellipsis characters" rule. This is also why the pre-commit
#   hook uses `--inplace --nobackup` directly instead of the `--auto`
#   convenience flag, which silently bundles smartquotes/ellipses in.

[formatting]
semantic = true
width = 100_000
cleanups = true
smartquotes = false
ellipses = false
