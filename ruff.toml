line-length = 100
# The 3.11 floor that #1196 gave the Python locks (PR #1201); Python 3.10 reaches
# end of life in October 2026. Set explicitly, because ruff's own default moves
# between releases (0.17.0 moved it from 3.10 to 3.11) and several rules below,
# such as UP017 and FURB162, fire only from a given version.
target-version = "py311"

[lint]
# Chosen explicitly (#1202), so a ruff bump does not change which rules run, short
# of a new rule under one of the four prefixes: ruff 0.15's default set ("E4",
# "E7", "E9", "F") plus ruff 0.17.0's default set, less the rules below. 17 of the
# 0.15 rules are not in ruff 0.17.0's default; they stay selected here.
#
# When a ruff bump removes a listed rule, every ruff run, `ruff format` included,
# stops with "Rule `X` was removed and cannot be selected", so the bump PR's
# python-ruff and shell-tests checks fail. Fix it in that PR by deleting X here;
# selecting a rule that replaces X is a separate decision. A renamed rule only
# warns ("`X` has been remapped to `Y`"); replace X with Y here.
#
# Rejected from ruff 0.17.0's default set in #1202:
#   UP031          printf-style formatting is a style choice, not a defect, and
#                  converting this tree's uses would be churn.
#   SIM117         a nested `with` is not a defect, and most of this tree's would
#                  exceed line-length if merged.
#   FLY002         its fix turns a line-per-row "\n".join([...]) into one long
#                  string, which reads worse than the rows it replaces.
#   EXE001 EXE002  they read the working tree's mode bits. Whether a shebang needs
#                  the executable bit is check-shebang-scripts-are-executable's job
#                  in scripts/lint/lint.sh, which reads git's recorded mode (#887).
#   S110 S112      they fire only on handlers that BLE001 or E722 already flag.
#   TRY004         these scripts raise RuntimeError, by contract, when an API
#                  response has the wrong shape.
