name: Enforce mutually exclusive labels

# When a label belonging to a mutually exclusive set is added to an issue or
# pull request, automatically removes any other labels from the same set so
# that at most one member of each set is present at any time.
#
# Mutually exclusive sets (fixed):
#   [p1, p2, p3]
#   [needs verification, verified]
#   [change requested, change done]
#   [orchestrate, orchestrating]
#
# Mutually exclusive prefix groups:
#   c-a-*   (author model, e.g. c-a-haiku, c-a-sonnet, c-a-opus)
#   c-r-*   (reviewer model, e.g. c-r-haiku, c-r-sonnet, c-r-opus)

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  enforce-exclusive-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Pinned to the base branch, never the pull request's own merge ref
        # (issue #882). This job holds issues: write and pull-requests: write
        # and then runs a script out of this checkout, so with the default ref
        # that script is pull-request-controlled content. It acts only through
        # the API, on titles, labels and comment bodies, and never needs pull
        # request file contents. github.sha covers the issues event, which
        # carries no pull request context; on a pull_request event github.sha
        # is the merge ref itself, so base.sha has to come first. Guarded by
        # scripts/ci/test_privileged_workflow_checkouts.py.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Enforce mutually exclusive label sets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ADDED_LABEL: ${{ github.event.label.name }}
        run: python3 scripts/ci/labels/enforce_mutually_exclusive_labels.py
