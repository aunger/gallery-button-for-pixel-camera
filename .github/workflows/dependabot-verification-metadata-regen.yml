name: Regenerate verification metadata for Dependabot PRs

# Automates the manual step PR #834 flagged and issue #842 asked for: every
# Dependabot PR that bumps a pin in app/build.gradle.kts moves the dependency
# graph, so gradle/verification-metadata.xml needs the same regeneration
# (scripts/regenerate-gradle-verification.sh) any other dependency bump in
# this repo requires (issue #714), or build.yml's Gradle invocation fails
# verification. Dependabot cannot run that script itself.
#
# This is one half of a two-workflow split; the other half,
# dependabot-verification-metadata-push.yml, does the actual write. Splitting
# them means the half with write access never runs code from the PR. This
# workflow runs on the ordinary `pull_request` trigger, exactly what
# build.yml already uses for every PR, so it gets the exact same treatment
# GitHub already forces on Dependabot's own PRs: GITHUB_TOKEN is read-only
# and no secrets are available (GitHub's own Dependabot-on-Actions security
# default). It only ever builds and uploads a file for the other workflow to
# pick up; it never writes to the repository, and permissions below never
# grant it contents: write. See the push workflow's header for why the write
# half needs a separate file and a personal access token, and
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
# for the pattern (an untrusted build workflow hands off an artifact to a
# privileged workflow_run workflow, which never checks out or executes PR
# code) this split follows.
#
# Gated on github.event.pull_request.user.login (the PR's original author,
# which no later push to the PR can change), not github.actor (who
# triggered THIS particular event, which a "@dependabot recreate" comment can
# set to dependabot[bot] on a PR that someone else actually opened and
# controls). See
# https://labs.boostsecurity.io/articles/weaponizing-dependabot-pwn-request-at-its-finest
# for the confused-deputy attack this specifically defends against.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: read

jobs:
  # A cheap gate in front of the expensive job below (issue #879).
  #
  # The push half's metadata commit is itself a push to the PR head, so it
  # fires `synchronize` and matches the path filter above, which GitHub
  # evaluates against the PR's whole base-to-head diff rather than against
  # the new commit alone. Ungated, every Dependabot PR therefore pays a
  # second full regeneration whose result cannot differ from the first: the
  # file it would regenerate is the one that commit just landed, generated
  # against that commit's own parent. On #874 that was 7.5 wasted minutes on
  # a warm cache, and this job is uncached by design (see the timeout note
  # below), so a cold one costs proportionally more.
  #
  # The discriminator is what the head commit *does*, not who it claims to be
  # from: a commit whose entire diff is gradle/verification-metadata.xml
  # cannot have moved the dependency graph, so regenerating against it
  # reproduces the file already on the branch. Keying on the committer
  # identity instead would have tied this gate to the exact email string the
  # push half writes, which issue #864 was changing in the same breath.
  #
  # Skipping wrongly costs far more than the run it saves: it leaves a
  # Dependabot PR red with stale metadata and no automated way back. So every
  # uncertain answer regenerates, and the only state that still reaches a
  # wrong skip is a commit pushed by hand whose entire diff is
  # gradle/verification-metadata.xml and whose contents were not generated
  # from this branch's graph. Nothing in this repository produces it,
  # Dependabot's own pushes always carry app/build.gradle.kts, and the way
  # out is the by-hand regeneration gradle/README.md already documents.
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_regen: ${{ steps.head_commit.outputs.needs_regen }}
    steps:
      - name: Check whether the head commit only carries regenerated metadata
        id: head_commit
        # Asks the API what the head commit changed rather than checking the
        # branch out, so this job runs no code from the PR either.
        #
        # Every uncertain answer regenerates. This gate is an optimization,
        # and the behavior it optimizes away was correct, so an unreachable
        # API or a payload without a usable file list falls back to it rather
        # than blocking the PR on a transient error or, worse, guessing that
        # nothing needs doing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILE_PATH: gradle/verification-metadata.xml
        run: |
          set -uo pipefail
          COMMIT_BODY="$RUNNER_TEMP/head-commit.json"
          if ! curl -sf -o "$COMMIT_BODY" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits/$HEAD_SHA"; then
            echo "needs_regen=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read $HEAD_SHA from the commits API, so what it changes is unknown; regenerating rather than assuming there is nothing to do."
            exit 0
          fi
          # An absent or unusable file list yields an empty string, which
          # never equals $FILE_PATH and so regenerates.
          CHANGED="$(jq -r 'if (.files | type) == "array" then (.files | map(.filename) | sort | join("\n")) else "" end' \
            "$COMMIT_BODY")"
          if [ "$CHANGED" = "$FILE_PATH" ]; then
            echo "needs_regen=false" >> "$GITHUB_OUTPUT"
            echo "$HEAD_SHA changes $FILE_PATH and nothing else, so it is this automation's own metadata commit; regenerating against it would reproduce the file it already carries. Skipping."
          else
            echo "needs_regen=true" >> "$GITHUB_OUTPUT"
            echo "$HEAD_SHA changes more than $FILE_PATH, so the dependency graph may have moved; regenerating."
          fi

  regenerate:
    needs: [triage]
    # The author gate is repeated here rather than left to `needs` alone: it
    # is the confused-deputy defense described in this file's header, and it
    # should not be one edit to the job graph away from disappearing.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && needs.triage.outputs.needs_regen == 'true'
    runs-on: ubuntu-latest
    # scripts/regenerate-gradle-verification.sh always sets a fresh mktemp
    # GRADLE_USER_HOME (so no previously-cached artifact is silently omitted
    # from the generated file), so this job's build+test invocation is just
    # as uncached as regenerate-gradle-toolchain.yml's identical call to the
    # same script. That sibling workflow documents a 20-45 minute cold run
    # for it and budgets 90 minutes; match that here instead of assuming
    # this job is faster. Never inherit GitHub's 360-minute default either
    # (issue #611).
    timeout-minutes: 90
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Pin the SDK components explicitly
        # Matches regenerate-gradle-toolchain.yml: platform-tools is required
        # because app/build.gradle.kts resolves adb via
        # sdkComponents.sdkDirectory + platform-tools/adb.
        run: sdkmanager --install "build-tools;36.0.0" "platforms;android-35" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Regenerate gradle/verification-metadata.xml
        # The committed wrapper is used (GRADLE_BIN defaults to ./gradlew),
        # unlike the toolchain generator's standalone Gradle: Dependabot is
        # scoped to app/build.gradle.kts (dependabot.yml, directory "/app"),
        # never the root build.gradle.kts toolchain pins, so the committed
        # wrapper is always new enough to run the bumped dependency graph.
        run: bash scripts/regenerate-gradle-verification.sh

      - name: Check whether regeneration changed anything
        id: diff
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No verification-metadata.xml change from this bump; nothing to hand off."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated file
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 1
