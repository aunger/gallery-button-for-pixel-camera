name: Block merge when a blocking label is present

# Fails the required status check whenever a blocking label is present on any
# open PR whose head is this commit, preventing merge until the label is
# removed.
#
# Blocking labels:
#   - verification needed
#   - changes requested
#   - changes done
#   - orchestrating
#
# The question is asked about the *commit*, not about the PR that fired the
# event, because that is what the answer is stored against: a check run
# attaches to a head commit, and GitHub evaluates a required check by taking
# the most recent run of that check name on that commit, regardless of which
# PR produced it. Reading only github.event.pull_request.labels therefore let
# two open PRs sharing a head commit answer for each other, and
# agents/pr_verify.md's live-fire recipe manufactured exactly that collision
# on PRs that were mid-verification (issue #833). See
# scripts/ci/labels/check_blocking_labels.py for the full rationale and for
# what the script does with the event payload.
#
# Triggers on the full set of PR events so the check always reflects the
# current label state:
#   - opened / reopened / synchronize: ensure fresh PRs are blocked from the start.
#   - labeled / unlabeled: re-evaluate immediately when the label changes.
#
# `closed` is deliberately absent. Closing a PR only ever removes a candidate
# from the set the script considers, so it can leave a commit blocked longer
# than needed but can never leave one wrongly unblocked, and any label event on
# a PR still at that commit re-evaluates it.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-blocking-labels:
    name: No blocking labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check for blocking labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/ci/labels/check_blocking_labels.py
