name: Strip Claude session-URL bylines

# Fires when GitHub content is created or edited that might carry a
# Claude session-URL byline (e.g. https://claude.ai/code/session_...).
# When a byline is found it is removed in place via the GitHub REST API
# so reviewers never need to catch it manually.
#
# The `if: github.actor != 'github-actions[bot]'` guard on every job
# prevents the bot's own edits from re-triggering the workflow.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-bylines:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      # TRUSTED_REF is the commit the checkout-based jobs pin, which the pull
      # request does not control: this job holds write scopes and runs a
      # script it downloads (issue #882). The fallback covers this workflow's
      # non-pull-request events. A commit rather than a branch name keeps
      # the three files from one commit. The rule is
      # scripts/ci/test_privileged_workflow_checkouts.py's; it inspects only
      # actions/checkout steps, so this job is pinned by
      # scripts/ci/test_strip_session_bylines_workflow.py.
      - name: Strip session-URL bylines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/strip"
          curl -fsS --parallel --retry 2 \
            --output-dir "$RUNNER_TEMP/strip" \
            -O "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TRUSTED_REF/scripts/ci/prs-and-issues/{strip_session_bylines,github_headers,session_bylines}.py"
          python3 "$RUNNER_TEMP/strip/strip_session_bylines.py"
