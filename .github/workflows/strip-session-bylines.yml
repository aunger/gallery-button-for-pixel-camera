name: Strip Claude session-URL bylines

# Fires when GitHub content is created or edited that might carry a
# Claude session-URL byline (e.g. https://claude.ai/code/session_...).
# When a byline is found it is removed in place via the GitHub REST API
# so reviewers never need to catch it manually.
#
# The `if: github.actor != 'github-actions[bot]'` guard on every job
# prevents the bot's own edits from re-triggering the workflow.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-bylines:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      # No checkout: the script runs from this file, so the job runs only
      # code this workflow file holds, which is already the code a pull
      # request controls on its own events (issue #882).
      # The region between the markers is generated from
      # scripts/ci/prs-and-issues/ by generate_strip_bylines_workflow.py.
      # Edit the modules there and rerun it; do not edit the region by hand.
      - name: Strip session-URL bylines
        shell: python3 {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # generated code begins here
          """github_headers.py: Shared GitHub REST API request headers.

          `post_pr_ci_summary_link.py`, `strip_session_bylines.py`, and
          `file_test_failure_issues.py` each authenticate to the GitHub REST API the
          same way. This module holds that one shared helper so the three scripts
          import it instead of each carrying its own byte-identical copy (issue #822).

          This module has no `main`; it is imported, not run directly.
          """


          def github_headers(token: str) -> dict[str, str]:
              """Return the standard header set for an authenticated GitHub REST API call."""
              return {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }


          """session_bylines.py: Recognize Claude session-URL bylines in GitHub content.

          `strip_session_bylines.py` repairs bylines after the fact, from a webhook.
          `scripts/agents/verify_github_write.py` has to recognize the same bylines at
          write time, so it can subtract them before diffing sent text against stored
          text.  This module holds the pattern and the one function both need, so the
          two callers share a definition instead of drifting apart.

          It deliberately imports nothing outside the standard library.  The write-time
          caller runs inside a Claude Code hook, where a missing third-party package
          would turn a check into a crash.

          This module has no `main`; it is imported, not run directly.
          """

          import re

          # Regex matching every occurrence of a Claude session-URL byline.
          # Two forms are matched:
          #
          #   Bare URL (preceded by a newline):
          #       \nhttps://claude.ai/code/session_<token>
          #
          #   Markdown-link footer (the form Claude agents actually emit):
          #       \n_Generated by [Claude Code](https://claude.ai/code[/session_<token>])_
          #
          #   The Markdown-link footer's URL may end at "code" or continue with a
          #   "/session_<token>" suffix; both are stripped (see issue #377).
          #
          #   The Markdown-link footer may optionally be preceded by a \n--- separator
          #   line (e.g. when the agent appended "---\n_Generated by ..._" at the end of
          #   a body).  The separator is consumed along with the footer so no orphaned
          #   "---" is left behind.
          BYLINE_RE = re.compile(
              r"\n(?:---\n)?_Generated by \[Claude Code\]\(https://claude\.ai/code(?:/session_\S+)?\)_"
              r"|"
              r"\nhttps://claude\.ai/code/session_\S+"
          )


          def strip_bylines(text: str) -> str:
              """Return *text* with all Claude session-URL bylines removed."""
              return BYLINE_RE.sub("", text)


          """strip_session_bylines.py: Remove Claude session-URL bylines from GitHub content.

          Scans a piece of text for Claude session-URL bylines and strips each
          occurrence so the surrounding text reads cleanly.
          Two forms are matched:

              \nhttps://claude.ai/code/session_<token>          (bare URL)
              \n_Generated by [Claude Code](https://claude.ai/code[/session_<token>])_
                                                                 (Markdown-link footer)

          The Markdown-link footer's URL may end at "code" or continue with a
          "/session_<token>" suffix; both are stripped, since agents have emitted
          both forms (see issue #377).

          An optional \n--- separator preceding the Markdown-link footer is consumed
          along with it so no orphaned "---" is left behind.
          If the content is unchanged after stripping, the caller should skip the
          PATCH call.

          The strip-session-bylines GitHub Actions workflow runs a copy of this module,
          with github_headers.py and session_bylines.py ahead of it, which
          generate_strip_bylines_workflow.py writes into the workflow file.
          Rerun that generator after editing any of the three.
          The workflow handles five event types:

            - issues [opened, edited]:                       issue body
            - issue_comment [created, edited]:               comments on issues and PRs
            - pull_request [opened, edited]:                 PR body
            - pull_request_review_comment [created, edited]: PR diff-line comments
            - pull_request_review [submitted]:               PR review body

          Usage (run locally; the workflow runs its generated copy):
              python3 scripts/ci/prs-and-issues/strip_session_bylines.py

          Environment variables (the workflow sets GITHUB_TOKEN; the runner sets the rest):
              GITHUB_TOKEN          GitHub token with issues:write and pull-requests:write.
              GITHUB_REPOSITORY     "owner/repo".
              GITHUB_EVENT_NAME     One of: issues, issue_comment, pull_request,
                                    pull_request_review_comment, pull_request_review.
              GITHUB_EVENT_PATH     Path to the JSON file with the full event payload.

          Exit code is always 0 so a missing/failed strip never breaks the caller.
          """

          import json
          import os
          import sys

          import requests

          # The byline pattern and strip_bylines() live in session_bylines.py, which
          # imports nothing outside the standard library, so the write-time checker in
          # scripts/agents/verify_github_write.py can reuse them from inside a hook
          # (issue #909).  strip_bylines is re-exported here because this module's
          # callers and tests have always reached it through this name.


          def _update(method: str, token: str, url: str, body: str) -> bool:
              """Update *url* with {"body": body} using the specified HTTP method.

              Args:
                  method: HTTP method name ("patch" or "put").
                  token: GitHub API token.
                  url: API endpoint URL.
                  body: The new body text.

              Returns:
                  True if the request succeeded, False otherwise.
              """
              try:
                  req_method = getattr(requests, method)
                  resp = req_method(
                      url,
                      headers=github_headers(token),
                      json={"body": body},
                      timeout=30,
                  )
                  resp.raise_for_status()
                  return True
              except Exception as exc:  # noqa: BLE001
                  print(f"Warning: {method.upper()} {url} failed: {exc}", file=sys.stderr)
                  return False


          def _patch(token: str, url: str, body: str) -> bool:
              """PATCH *url* with {"body": body}; return True on success."""
              return _update("patch", token, url, body)


          def _put(token: str, url: str, body: str) -> bool:
              """PUT *url* with {"body": body}; return True on success."""
              return _update("put", token, url, body)


          def handle_issue(token: str, repository: str, payload: dict) -> bool:
              """Strip bylines from an issue body.  Returns True if a PATCH was issued."""
              issue = payload.get("issue", {})
              number = issue.get("number")
              body = issue.get("body") or ""

              stripped = strip_bylines(body)
              if stripped == body:
                  print(f"Issue #{number}: no bylines found, skipping.")
                  return False

              url = f"https://api.github.com/repos/{repository}/issues/{number}"
              ok = _patch(token, url, stripped)
              if ok:
                  print(f"Issue #{number}: bylines stripped.")
              return ok


          def handle_issue_comment(token: str, repository: str, payload: dict) -> bool:
              """Strip bylines from an issue/PR comment.  Returns True if a PATCH was issued."""
              comment = payload.get("comment", {})
              comment_id = comment.get("id")
              body = comment.get("body") or ""

              stripped = strip_bylines(body)
              if stripped == body:
                  print(f"Comment #{comment_id}: no bylines found, skipping.")
                  return False

              url = f"https://api.github.com/repos/{repository}/issues/comments/{comment_id}"
              ok = _patch(token, url, stripped)
              if ok:
                  print(f"Comment #{comment_id}: bylines stripped.")
              return ok


          def handle_pull_request(token: str, repository: str, payload: dict) -> bool:
              """Strip bylines from a PR body.  Returns True if a PATCH was issued."""
              pr = payload.get("pull_request", {})
              number = pr.get("number")
              body = pr.get("body") or ""

              stripped = strip_bylines(body)
              if stripped == body:
                  print(f"PR #{number}: no bylines found, skipping.")
                  return False

              url = f"https://api.github.com/repos/{repository}/pulls/{number}"
              ok = _patch(token, url, stripped)
              if ok:
                  print(f"PR #{number}: bylines stripped.")
              return ok


          def handle_pull_request_review_comment(token: str, repository: str, payload: dict) -> bool:
              """Strip bylines from a PR review comment.  Returns True if a PATCH was issued."""
              comment = payload.get("comment", {})
              comment_id = comment.get("id")
              body = comment.get("body") or ""

              stripped = strip_bylines(body)
              if stripped == body:
                  print(f"Review comment #{comment_id}: no bylines found, skipping.")
                  return False

              url = f"https://api.github.com/repos/{repository}/pulls/comments/{comment_id}"
              ok = _patch(token, url, stripped)
              if ok:
                  print(f"Review comment #{comment_id}: bylines stripped.")
              return ok


          def handle_pull_request_review(token: str, repository: str, payload: dict) -> bool:
              """Strip bylines from a PR review body.  Returns True if a PUT was issued."""
              review = payload.get("review", {})
              pr = payload.get("pull_request", {})
              review_id = review.get("id")
              pr_number = pr.get("number")
              body = review.get("body") or ""

              stripped = strip_bylines(body)
              if stripped == body:
                  print(f"Review #{review_id}: no bylines found, skipping.")
                  return False

              url = f"https://api.github.com/repos/{repository}/pulls/{pr_number}/reviews/{review_id}"
              ok = _put(token, url, stripped)
              if ok:
                  print(f"Review #{review_id}: bylines stripped.")
              return ok


          _HANDLER_NAMES = {
              "issues": "handle_issue",
              "issue_comment": "handle_issue_comment",
              "pull_request": "handle_pull_request",
              "pull_request_review_comment": "handle_pull_request_review_comment",
              "pull_request_review": "handle_pull_request_review",
          }


          def main(argv: list[str] | None = None) -> int:
              del argv  # No CLI arguments; configuration is entirely from the environment.

              token = os.environ.get("GITHUB_TOKEN", "")
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")

              if not token:
                  print("GITHUB_TOKEN not set--skipping.", file=sys.stderr)
                  return 0
              if not repository:
                  print("GITHUB_REPOSITORY not set--skipping.", file=sys.stderr)
                  return 0
              if not event_name:
                  print("GITHUB_EVENT_NAME not set--skipping.", file=sys.stderr)
                  return 0
              if not event_path:
                  print("GITHUB_EVENT_PATH not set--skipping.", file=sys.stderr)
                  return 0

              handler_name = _HANDLER_NAMES.get(event_name)
              if handler_name is None:
                  print(f"Unsupported event '{event_name}'--skipping.", file=sys.stderr)
                  return 0
              handler = globals()[handler_name]

              try:
                  with open(event_path, encoding="utf-8") as fh:
                      payload = json.load(fh)
              except Exception as exc:  # noqa: BLE001
                  print(f"Warning: could not read event payload at '{event_path}': {exc}", file=sys.stderr)
                  return 0

              handler(token, repository, payload)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          # generated code ends here
