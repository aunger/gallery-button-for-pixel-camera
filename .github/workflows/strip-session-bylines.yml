name: Strip Claude session-URL bylines

# Fires when GitHub content is created or edited that might carry a
# Claude session-URL byline (e.g. https://claude.ai/code/session_...).
# When a byline is found it is removed in place via the GitHub REST API
# so reviewers never need to catch it manually.
#
# The `if: github.actor != 'github-actions[bot]'` guard on the job
# prevents the bot's own edits from re-triggering the workflow.
#
# No checkout: the action runs its own copy of the script, at the commit the
# `uses:` line pins. On pull request and review events this file itself comes
# from the pull request's merge ref, so that is no boundary there; see
# .github/workflows/CLAUDE.md.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-bylines:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Strip session-URL bylines
        uses: aunger/vcs-automation/strip-session-bylines@d761b016d150f9d6e511afb04341a3f009a71a7e # v1.0.0
