name: Strip Claude session-URL bylines

# Fires when GitHub content is created or edited that might carry a
# Claude session-URL byline (e.g. https://claude.ai/code/session_...).
# When a byline is found it is removed in place via the GitHub REST API
# so reviewers never need to catch it manually.
#
# The `if: github.actor != 'github-actions[bot]'` guard on every job
# prevents the bot's own edits from re-triggering the workflow.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-bylines:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      # No checkout: the job runs only the script below, so no repository
      # file, and nothing a pull request controls but this workflow file,
      # is read (issue #882).
      - name: Strip session-URL bylines
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          import json
          import os
          import re
          import sys
          import urllib.request

          BYLINE_RE = re.compile(
              r"\n(?:---\n)?_Generated by \[Claude Code\]\(https://claude\.ai/code(?:/session_\S+)?\)_"
              r"|\nhttps://claude\.ai/code/session_\S+"
          )

          # event name: (payload key of the edited item, HTTP method, API path)
          TARGETS = {
              "issues": ("issue", "PATCH", lambda p: f"issues/{p['issue']['number']}"),
              "issue_comment": ("comment", "PATCH", lambda p: f"issues/comments/{p['comment']['id']}"),
              "pull_request": ("pull_request", "PATCH", lambda p: f"pulls/{p['pull_request']['number']}"),
              "pull_request_review_comment": ("comment", "PATCH", lambda p: f"pulls/comments/{p['comment']['id']}"),
              "pull_request_review": (
                  "review",
                  "PUT",
                  lambda p: f"pulls/{p['pull_request']['number']}/reviews/{p['review']['id']}",
              ),
          }

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              payload = json.load(fh)
          key, method, path = TARGETS[os.environ["GITHUB_EVENT_NAME"]]
          body = payload[key].get("body") or ""
          stripped = BYLINE_RE.sub("", body)
          if stripped == body:
              print("No bylines found, skipping.")
              sys.exit(0)

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path(payload)}"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": stripped}).encode(),
              method=method,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              urllib.request.urlopen(request, timeout=30).close()
              print("Bylines stripped.")
          except Exception as exc:  # A failed strip must not fail the job.
              print(f"Warning: {method} {url} failed: {exc}", file=sys.stderr)
