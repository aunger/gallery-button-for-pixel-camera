name: Strip Claude session-URL bylines

# Fires when GitHub content is created or edited that might carry a
# Claude session-URL byline (e.g. https://claude.ai/code/session_...).
# When a byline is found it is removed in place via the GitHub REST API
# so reviewers never need to catch it manually.
#
# The `if: github.actor != 'github-actions[bot]'` guard on every job
# prevents the bot's own edits from re-triggering the workflow.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-bylines:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      # Pinned to the base branch, never the pull request's own merge ref
      # (issue #882). This job holds issues: write and pull-requests: write
      # and then runs a script out of this checkout, so with the default ref
      # that script is pull-request-controlled content. It only rewrites
      # bodies through the API and never needs pull request file contents.
      # github.sha covers the issues and issue_comment events, which carry no
      # pull request context; on a pull_request event github.sha is the merge
      # ref itself, so base.sha has to come first. Guarded by
      # scripts/ci/test_privileged_workflow_checkouts.py.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Strip session-URL bylines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/ci/prs-and-issues/strip_session_bylines.py
