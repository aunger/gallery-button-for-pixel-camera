name: Label PR by title

# Applies labels to a pull request based on regex matches against its
# title. See scripts/label_pr_by_title.py for the exact rules. Labels are
# only ever added, never removed.

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  label-by-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply labels matching the PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/label_pr_by_title.py
