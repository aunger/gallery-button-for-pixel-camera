name: Archive Stale Test-Failure Issues

on:
  schedule:
    - cron: '37 4 * * *'   # daily at 04:37 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive stale test-failure issues
        uses: aunger/vcs-automation/archive-stale-test-failures@3a677839fad0d24f69887ad547a3f911b9d876e3 # v1.2.0
        with:
          stale-days: '10'
