name: Archive Stale Test-Failure Issues

# The schedule's minute is off the hour, which GitHub's scheduler is busiest at;
# scheduled runs of this workflow have started four to eight hours late.
# workflow_dispatch lets a run be started by hand.
on:
  schedule:
    - cron: '37 4 * * *'   # daily at 04:37 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive stale test-failure issues
        uses: aunger/vcs-automation/archive-stale-test-failures@7473f2326de1ee204e4121633ae86f6938a5f2a7
        with:
          stale-days: '10'
