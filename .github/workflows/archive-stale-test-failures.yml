name: Archive Stale Test-Failure Issues

on:
  schedule:
    - cron: '37 4 * * *'   # daily at 04:37 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive stale test-failure issues
        uses: aunger/vcs-automation/archive-stale-test-failures@d761b016d150f9d6e511afb04341a3f009a71a7e # v1.0.0
        with:
          stale-days: '10'
