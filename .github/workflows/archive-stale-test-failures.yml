name: Archive Stale Test-Failure Issues

on:
  schedule:
    - cron: '37 4 * * *'   # daily at 04:37 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive stale test-failure issues
        uses: aunger/vcs-automation/archive-stale-test-failures@96928d129b95c0e2dd08e09cdf89f5dd892ad9d4 # v1.1.0
        with:
          stale-days: '10'
