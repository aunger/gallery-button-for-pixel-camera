name: Branch Cleanup Report

# The report job sorts every branch into Delete, Review and Keep, writes that to the job
# summary, and writes a checklist of the Delete and Review branches to a tracking issue.
# The delete job then waits for approval in the branch-deletion environment. Once approved, it
# sorts every branch again and deletes the ones ticked on the issue at that moment, out of the
# ones the report job offered. It takes that offer from the report job's output, not from the
# issue, so a line someone adds to the issue deletes nothing.
# The rules, and the checks delete makes before deleting anything, are in the docstring of
# scripts/ci/prs-and-issues/branch_cleanup_report.py.
#
# The branch-deletion environment needs required reviewers (Settings > Environments). Without
# them the delete job starts unapproved, and the script refuses to delete anything.
# Limit its deployment branches to main too: a manual run can use the copy of this workflow
# on any branch, and only main's copy has been reviewed.

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays at 05:23 UTC
  workflow_dispatch:

# A new run rewrites the checklist, so it cancels a run still waiting for approval.
concurrency:
  group: branch-cleanup
  cancel-in-progress: true

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      choices: ${{ steps.report.outputs.choices }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write report and checklist
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/prs-and-issues/branch_cleanup_report.py report --checklist
          --choices-output "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  delete:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: branch-deletion
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete ticked branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOICES: ${{ needs.report.outputs.choices }}
        run: >-
          python3 scripts/ci/prs-and-issues/branch_cleanup_report.py delete
          --environment branch-deletion --choices "$CHOICES"
          >> "$GITHUB_STEP_SUMMARY"
