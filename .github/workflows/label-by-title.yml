name: Label issue/PR by title

# Applies labels to an issue or pull request based on regex matches against
# its title, through vcs-automation's label-by-title action. The `rules` input
# below is the table: each label maps to regexes that count as alternatives,
# matched case-insensitively; the action's action.yml gives the format.
# Labels are only ever added, never removed.
#
# `skip-on-pull-requests` keeps "agents" off pull requests: label-by-files.yml
# decides it there from the changed files, so the two signals never race for
# the same label. The two tables must agree on it, and on what
# propagate-issue-labels.yml excludes; scripts/ci/test_label_tables.py checks
# that.
#
# Runs on "opened" (a fresh title) or "edited" where the title itself
# changed (github.event.changes.title is only present when the title was
# part of the edit), so unrelated edits (body, labels, base branch) do
# not re-trigger it.
#
# To apply a rule change to existing issues and pull requests, run
# label-by-title/backfill_labels_by_title.py from a checkout of
# aunger/vcs-automation, with its requirements.txt installed (reading
# --workflow needs PyYAML), pointing it at this file:
#
#   GITHUB_TOKEN=... GITHUB_REPOSITORY=aunger/gallery-button-for-pixel-camera \
#     python3 label-by-title/backfill_labels_by_title.py -n \
#     --workflow <this checkout>/.github/workflows/label-by-title.yml
#
# -n reports what it would add; -f adds it. Its docstring has the rest.
#
# No checkout: the action runs its own copy of the script, at the commit the
# `uses:` line pins; see .github/workflows/CLAUDE.md.

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-by-title:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.changes.title
    steps:
      - name: Apply labels matching the title
        uses: aunger/vcs-automation/label-by-title@2f12f1a9c1f064e1a69c4b098776041946092712 # v1.3.0
        with:
          rules: |
            {
              "ci": [
                "(\\b|_)ci(\\b|_)",
                "(\\b|_)automat\\w+(\\b|_)",
                "(\\b|_)workflow\\w*",
                "(\\b|_)github[\\W_]*action\\w*",
                "(\\b|_)e2e\\w*",
                "(?=.*(\\b|_)merg\\w+)(?=.*((\\b|_)gat(ing|e[ds]?)(\\b|_)|(\\b|_)(un)?block\\w*|(\\b|_)prs?(\\b|_)))",
                "(\\b|_)pre-?flight\\w*",
                "(\\b|_)codeql(\\b|_)"
              ],
              "agents": [
                "(\\b|_)agent\\w*",
                "(\\b|_)dev_orchestration(\\b|_)",
                "(\\b|_)rules?(\\b|_)",
                "(\\b|_)attributions?(\\b|_)",
                "(\\b|_)bylines?(\\b|_)",
                "(?=.*(\\b|_)verif\\w+(\\b|_))(?=.*((\\b|_)planner(\\b|_)|(\\b|_)labels?(\\b|_)|(\\b|_)prs?(\\b|_)))",
                "(\\b|_)author(\\b|_)",
                "(\\b|_)reviewers?(\\b|_)",
                "(\\b|_)orchestrat\\w*",
                "(\\b|_)ci[\\W_]*monitor\\w*",
                "(\\b|_)sub[\\W_]?agent\\w*"
              ],
              "automated tests": [
                "(\\b|_)e2e(\\b|_)",
                "(\\b|_)unit(\\b|_)",
                "(\\b|_)test\\w*",
                "\\w*e2etest\\w*",
                "(\\b|_)pre-?flight\\w*",
                "(?-i:\\w*Test(\\b|_))"
              ]
            }
          skip-on-pull-requests: |
            ["agents"]
