name: Label issue/PR by title

# Applies labels to an issue or pull request based on regex matches
# against its title. See scripts/ci/labels/label_by_title.py for the exact rules.
# Labels are only ever added, never removed.
#
# IS_PULL_REQUEST tells the script which artifact it is labeling. On a pull
# request it suppresses the labels label-by-files.yml determines from the
# changed files, so the two signals never race for the same label.
#
# Runs on "opened" (a fresh title) or "edited" where the title itself
# changed (github.event.changes.title is only present when the title was
# part of the edit), so unrelated edits (body, labels, base branch) do
# not re-trigger it.

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-by-title:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.changes.title
    steps:
      - name: Check out repository
        # Pinned to a ref the pull request does not control: this job holds
        # write scopes and runs a script out of this checkout (issue #882).
        # The fallback covers this workflow's non-pull-request events. Rule,
        # rationale and limits: scripts/ci/test_privileged_workflow_checkouts.py.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Apply labels matching the title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci/labels/label_by_title.py
