name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  # Gate for PRs and merges: compiles, runs unit tests, then E2E tests on an emulator.
  # Unit tests run first so a fast failure skips the slower emulator phase.
  # On success the single debug build is reused for both test suites.
  #
  # E2E background: the real Pixel Camera APK refuses to start on non-Pixel emulators
  # (PairIP device-compatibility check). The e2e-mock-camera module has the same
  # applicationId ("com.google.android.GoogleCamera") and opens the camera hardware
  # on resume, so GB4PC's CameraManager callback and UsageStats-based foreground
  # detection are exercised identically to the real app.
  #
  # We manage the emulator lifecycle ourselves rather than using
  # reactivecircus/android-emulator-runner@v2 because the runner action
  # unconditionally runs `adb shell input keyevent 82` immediately after
  # sys.boot_completed=1, before system services accept binder connections on
  # the slow API-35 emulator — causing exit code 224 (Broken Pipe) before our
  # script ever starts. The explicit steps below poll for true service readiness.
  build-and-test:
    # ubuntu-latest has KVM hardware acceleration (available since April 2024).
    runs-on: ubuntu-latest

    outputs:
      # Surfaced so link-pr-to-ci-summary (issue #331) can tell whether the
      # "Write test-result summary" step actually ran--on docs-only PRs it is
      # skipped, and the job's "Summary" section has nothing to link to.
      needs_full_build: ${{ steps.diff_check.outputs.needs_full_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for non-docs changes
        id: diff_check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Always build on direct pushes to main (e.g. merge commits).
            echo "needs_full_build=true" >> $GITHUB_OUTPUT
          else
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=1
            echo "needs_full_build=$(scripts/check_non_docs_changes.sh "origin/$BASE_REF")" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.diff_check.outputs.needs_full_build == 'true'
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        if: steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install emulator, system image, and create AVD
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          sdkmanager --install \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          # Pin AVD home to a stable path so both avdmanager and the emulator
          # agree on where AVDs live, regardless of what android-actions sets.
          AVD_HOME="$HOME/.android/avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> $GITHUB_ENV

          echo "==> Creating AVD (ANDROID_AVD_HOME=$AVD_HOME)..."
          echo "no" | avdmanager create avd \
            --name e2e_avd \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 \
            --force

          echo "==> AVD directory contents:"
          ls -la "$AVD_HOME/" || echo "(empty or missing)"

          echo "==> emulator -list-avds:"
          ANDROID_AVD_HOME="$AVD_HOME" $ANDROID_HOME/emulator/emulator -list-avds

      - name: Install Python script dependencies
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Run Python script unit tests
        if: steps.diff_check.outputs.needs_full_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run shell script unit tests
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          for test_script in scripts/test_*.sh; do
            echo "==> Running $test_script"
            bash "$test_script"
          done

      - name: Grant execute permission for gradlew
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: chmod +x gradlew

      - name: Build and run unit tests
        if: steps.diff_check.outputs.needs_full_build == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p results
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest :e2e-mock-camera:assembleDebug \
            :e2e-mock-gallery:assembleDebug \
            testDebugUnitTest -PversionName=dev.${{ github.run_number }} \
            | tee >(grep '^##GB4PC_TEST##' > results/unit.ndjson)

      - name: Upload unit test results
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/
          retention-days: 14

      - name: Upload unit test markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-unit
          path: results/unit.ndjson
          retention-days: 14

      - name: Start emulator
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === KVM device:"
          ls -la /dev/kvm || echo "WARNING: /dev/kvm not found"

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Available AVDs:"
          $ANDROID_HOME/emulator/emulator -list-avds

          $ANDROID_HOME/emulator/emulator \
            -avd e2e_avd \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            > /tmp/emulator.log 2>&1 &
          EMUPID=$!
          echo "EMULATOR_PID=$EMUPID" >> $GITHUB_ENV
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Emulator launched (PID=$EMUPID)"

          # Give it 5 seconds to detect an immediate crash
          sleep 5
          if ! kill -0 "$EMUPID" 2>/dev/null; then
            echo "ERROR: Emulator process already exited!" >&2
            echo "=== Emulator log ===" >&2
            cat /tmp/emulator.log >&2
            exit 1
          fi
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Emulator process alive."

      # Poll for true service readiness — not just sys.boot_completed=1.
      # sys.boot_completed is set while binder threads are still saturated;
      # we wait until `settings` actually responds before issuing any commands.
      - name: Wait for emulator service readiness
        if: steps.diff_check.outputs.needs_full_build == 'true'
        timeout-minutes: 10
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for ADB device (timeout 1200s)..."
          timeout 1200 "$ADB" wait-for-device || {
            echo "ERROR: Emulator did not appear on ADB after 1200s" >&2
            echo "=== Emulator log (last 80 lines) ===" >&2
            tail -80 /tmp/emulator.log >&2
            exit 1
          }

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for sys.boot_completed=1..."
          until [[  "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            sleep 5
          done
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Boot flag set."

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for settings service..."
          SVCWAIT=0
          until "$ADB" shell settings get global airplane_mode_on > /dev/null 2>&1; do
            if [[ $SVCWAIT -ge 120 ]]; then
              echo "ERROR: Services not ready after 120s post-boot." >&2
              exit 1
            fi
            sleep 5
            SVCWAIT=$((SVCWAIT + 5))
            echo "  ...not ready yet (${SVCWAIT}s since boot flag)"
          done
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Services ready (${SVCWAIT}s after boot flag)."

          # Wake, unlock, keep on, and disable animations now that services are up.
          # Use the same wake + upward-swipe sequence as the pre-flight step and
          # E2EFixture.wakeAndDismissKeyguard(): KEYCODE_MENU (82) could not reliably
          # dismiss the swipe-type lock screen on the API-35 CI emulator (issue #341).
          # sleep 2 lets the swipe animation complete before subsequent commands fire
          # (same reasoning as the pre-flight step's post-swipe sleep 2).
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          # Prevent the screen from sleeping while the emulator is "plugged in"
          # (value 7 = stay on for AC/USB/wireless charging combined).
          # Without this the screen can time out between the unlock here and the
          # `am start` in the pre-flight step, preventing the activity window from
          # appearing over the lock screen.
          "$ADB" shell settings put global stay_on_while_plugged_in 7
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0

      - name: CI pre-flight — MockCameraActivity smoke check
        if: steps.diff_check.outputs.needs_full_build == 'true'
        id: preflight
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Install mock Pixel Camera and grant CAMERA permission before the smoke check.
          echo "==> Installing mock Pixel Camera for pre-flight check..."
          "$ADB" install -r \
            e2e-mock-camera/build/outputs/apk/debug/e2e-mock-camera-debug.apk
          # Adaptive ANR watcher: waits for Pixel Launcher to settle after install (Issue #194)
          chmod +x scripts/dismiss_anr.sh
          scripts/dismiss_anr.sh --adb "$ADB" &
          SETTLE_PID=$!
          echo "==> Granting CAMERA permission..."
          "$ADB" shell pm grant com.google.android.GoogleCamera \
            android.permission.CAMERA

          # Wake the display and dismiss the swipe keyguard before launching the
          # activity. An upward swipe is used instead of wm dismiss-keyguard:
          # wm dismiss-keyguard did not reliably dismiss the swipe-type lock
          # screen on the API-35 CI emulator (all retries returned #E9E8EF).
          # sleep 2 lets the swipe animation complete before am start -W fires.
          echo "==> Waking display and dismissing keyguard..."
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2

          # Launch MockCameraActivity and wait for it to be displayed.
          # am start -W blocks until the activity is on screen, so no polling needed.
          echo "==> Launching MockCameraActivity..."
          "$ADB" shell am start -W -n \
            com.google.android.GoogleCamera/com.gb4pc.mockcamera.MockCameraActivity

          # Re-wake after am start -W: adb install above can take 10-30 s and
          # the screen may sleep in that window. am start -W and
          # setTurnScreenOn(true) usually recover, but this is a cheap extra
          # guarantee that the green view is visible before screencap. Use the
          # same swipe unlock to stay consistent.
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2

          wait "$SETTLE_PID" || true

          python3 scripts/check_green_feed.py --adb "$ADB" preflight.png

      - name: Upload preflight screenshot on failure
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && steps.preflight.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: preflight-screenshot
          path: preflight.png
          retention-days: 14

      - name: Run E2E emulator setup
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          chmod +x scripts/setup-e2e-emulator.sh
          # --post-boot skips AVD creation/boot; AVD is already running from the
          # boot step above. MockCameraActivity (solid-green View) is the camera.
          scripts/setup-e2e-emulator.sh --post-boot

          # Install mock Pixel Camera before invoking the Gradle task. The Gradle
          # task's doLast block also installs it (for local dev convenience), but
          # that install has not proven reliable on its own in CI; this pre-install
          # is the verified stable path that guarantees mock-camera is on-device.
          echo "==> Installing mock Pixel Camera..."
          "$ADB" install -r \
            e2e-mock-camera/build/outputs/apk/debug/e2e-mock-camera-debug.apk
          echo "==> Granting CAMERA permission to mock Pixel Camera..."
          "$ADB" shell pm grant com.google.android.GoogleCamera \
            android.permission.CAMERA

          echo "==> Mock PC resolve check:"
          "$ADB" shell pm resolve-activity --brief \
            -a android.media.action.STILL_IMAGE_CAMERA \
            -p com.google.android.GoogleCamera 2>/dev/null || true

      - name: Run instrumented tests
        # We deliberately do NOT use `continue-on-error` here (see issue #309):
        # it swallowed *every* error, including non-test breakage, so CI went
        # green while real failures hid. Instead we record this step's real exit
        # status as an output and let later steps run; the final
        # "Gate on test failures" step is the single authority on pass/fail,
        # consulting both the JUnit XML and this recorded outcome against the
        # red-to-green allowlist (.github/allowed-test-failures.txt).
        id: run_instrumented
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Wake and dismiss the swipe keyguard before starting the test suite.
          # The E2E setup (including mock-camera install) can take 10-30 s, and the
          # screen may sleep or re-lock in that window. This mirrors
          # E2EFixture.wakeAndDismissKeyguard() (issue #344 / #341).
          # sleep 2 lets the swipe animation complete before Gradle's am start fires
          # (same reasoning as the pre-flight step's post-swipe sleep 2).
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          if ./gradlew connectedDebugAndroidTest; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy instrumented test results
        if: steps.diff_check.outputs.needs_full_build == 'true'
        continue-on-error: true
        run: |
          mkdir -p app/build/outputs/androidTest-results/instrumented
          cp -r app/build/outputs/androidTest-results/connected/debug/. \
            app/build/outputs/androidTest-results/instrumented/

      - name: Run PixelCameraOverlayE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        id: run_overlay_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Wake and dismiss the swipe keyguard before starting the test suite.
          # The instrumented tests can run for several minutes, and the screen may
          # sleep or re-lock before this step starts. This mirrors
          # E2EFixture.wakeAndDismissKeyguard() (issue #344 / #341).
          # sleep 2 lets the swipe animation complete before Gradle's am start fires
          # (same reasoning as the pre-flight step's post-swipe sleep 2).
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          # Start screen recording for the overlay E2E suite (issue #520).
          # screenrecord must start AFTER KEYCODE_WAKEUP: if the display is off the
          # process exits immediately with INVALID_LAYER_STACK and the output is 0 bytes.
          # The moov atom (required for a playable MP4) is only written on a clean SIGINT
          # exit; SIGTERM is not handled by screenrecord and leaves the file unplayable.
          # Do NOT kill the host-side adb shell wrapper ($RECPID_OVERLAY): tearing down
          # the adb transport races the muxer flush and can truncate the moov atom.
          "$ADB" shell screenrecord /sdcard/e2e-overlay.mp4 &
          RECPID_OVERLAY=$!
          sleep 1
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.PixelCameraOverlayE2ETest \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-overlay.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi
          # Stop screenrecord cleanly so the moov atom is written and the MP4 is playable.
          # pkill -INT -x screenrecord sends SIGINT to the device-side process by exact
          # name (-x prevents partial-name matches on toybox). Poll with pidof until the
          # process exits, confirming the muxer finished flushing, before reaping the
          # host-side wrapper with wait. A fixed sleep is not sufficient.
          echo "  stopping screenrecord (overlay suite)"
          "$ADB" shell pkill -INT -x screenrecord 2>/dev/null || true
          echo "  waiting for screenrecord to finalize the MP4"
          for i in $(seq 1 30); do
            "$ADB" shell pidof screenrecord > /dev/null 2>&1 || break
            sleep 1
          done
          wait "$RECPID_OVERLAY" 2>/dev/null || true
          # Capture the filtered logcat regardless of pass/fail (issues #364/#365).
          # The GB4PC_E2E diagnostic lines from E2EFixture.launchPixelCamera() are
          # what make the issue #233 bounded-relaunch path observable, but they are
          # only useful if they survive a *green* run too -- on a pass the retry
          # either fired and recovered or never fired, and only the logcat can tell
          # the two apart. Dumping it only in the failure branch discarded that
          # evidence on every passing run, so always tee it to a file and upload it.
          echo "=== LOGCAT (since test start) ==="
          "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
            bash scripts/filter_logcat.sh | tee results/e2e-overlay-logcat.txt

      - name: Pull and upload overlay E2E video on failure
        # Only pull and upload the recording when the overlay E2E suite failed (issue #520).
        # On a green run the file is left on the device and discarded when the emulator exits.
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && steps.run_overlay_e2e.outputs.outcome == 'failure'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/e2e-videos
          "$ADB" pull /sdcard/e2e-overlay.mp4 /tmp/e2e-videos/e2e-overlay.mp4 || \
            echo "WARNING: could not pull e2e-overlay.mp4"

      - name: Upload overlay E2E video artifact
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && steps.run_overlay_e2e.outputs.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-overlay-video
          path: /tmp/e2e-videos/e2e-overlay.mp4
          retention-days: 14

      - name: Upload overlay E2E markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-overlay
          path: |
            results/e2e-overlay.ndjson
            results/e2e-overlay-logcat.txt
          retention-days: 14

      - name: Run GalleryButtonVisualE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        id: run_gallery_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Wake and dismiss the swipe keyguard before starting the test suite.
          # The previous E2E suite (PixelCameraOverlayE2ETest) can run for several
          # minutes, and the screen may sleep or re-lock before this step starts.
          # This mirrors E2EFixture.wakeAndDismissKeyguard() (issue #344 / #341).
          # sleep 2 lets the swipe animation complete before Gradle's am start fires
          # (same reasoning as the pre-flight step's post-swipe sleep 2).
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          # Start screen recording for the gallery E2E suite (issue #520).
          # See the overlay E2E step above for the rationale on display-on-first,
          # SIGINT-only stop, and why the host-side adb shell wrapper must not be
          # killed before muxer flush.
          "$ADB" shell screenrecord /sdcard/e2e-gallery.mp4 &
          RECPID_GALLERY=$!
          sleep 1
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.GalleryButtonVisualE2ETest \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-gallery.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
              bash scripts/filter_logcat.sh
          fi
          # Stop screenrecord cleanly so the moov atom is written and the MP4 is playable.
          echo "  stopping screenrecord (gallery suite)"
          "$ADB" shell pkill -INT -x screenrecord 2>/dev/null || true
          echo "  waiting for screenrecord to finalize the MP4"
          for i in $(seq 1 30); do
            "$ADB" shell pidof screenrecord > /dev/null 2>&1 || break
            sleep 1
          done
          wait "$RECPID_GALLERY" 2>/dev/null || true

      - name: Pull and upload gallery E2E video on failure
        # Only pull and upload the recording when the gallery E2E suite failed (issue #520).
        # On a green run the file is left on the device and discarded when the emulator exits.
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && steps.run_gallery_e2e.outputs.outcome == 'failure'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/e2e-videos
          "$ADB" pull /sdcard/e2e-gallery.mp4 /tmp/e2e-videos/e2e-gallery.mp4 || \
            echo "WARNING: could not pull e2e-gallery.mp4"

      - name: Upload gallery E2E video artifact
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && steps.run_gallery_e2e.outputs.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-gallery-video
          path: /tmp/e2e-videos/e2e-gallery.mp4
          retention-days: 14

      - name: Upload gallery E2E markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-gallery
          path: results/e2e-gallery.ndjson
          retention-days: 14

      - name: Run PermissionsGrantedE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # Issue #564 review: this suite was added to close #566/#567/#568 with real
        # automated coverage, but was initially left out of every
        # `connectedE2EAndroidTest -Pe2eClass=...` invocation in this workflow, so it
        # compiled but never actually ran. `am instrument -e class` runs only the named
        # class, not the rest of its package, so a dedicated step is required, mirroring
        # the two suites above. It was then split into two classes (granted/denied) after
        # a second review round found the original single-class design changed the media
        # permission on the already-running `com.gb4pc` process mid-test, which crashes
        # that process (see PermissionsDeniedE2ETest's class doc). This step runs under
        # the task's default precondition (permission granted before the process starts),
        # same as every other E2E suite.
        id: run_permissions_granted_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          # Wake and dismiss the swipe keyguard before starting the test suite.
          # The previous E2E suites can run for several minutes, and the screen
          # may sleep or re-lock before this step starts. This mirrors
          # E2EFixture.wakeAndDismissKeyguard() (issue #344 / #341).
          # sleep 2 lets the swipe animation complete before Gradle's am start fires
          # (same reasoning as the pre-flight step's post-swipe sleep 2).
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.PermissionsGrantedE2ETest \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-permissions-granted.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
              bash scripts/filter_logcat.sh
          fi

      - name: Upload permissions-granted E2E markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-permissions-granted
          path: results/e2e-permissions-granted.ndjson
          retention-days: 14

      - name: Run PermissionsDeniedE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # -PmediaPermissionGranted=false makes connectedE2EAndroidTest's doLast block
        # (app/build.gradle.kts) `pm revoke` READ_MEDIA_IMAGES before `am instrument`
        # starts the com.gb4pc process, instead of the default `pm grant`. This class
        # must never run without that flag: launching it under the default grant would
        # violate its own precondition assertion, and toggling the permission from
        # inside a running test crashes the process (see the class doc).
        id: run_permissions_denied_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.PermissionsDeniedE2ETest \
            -PmediaPermissionGranted=false \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-permissions-denied.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
              bash scripts/filter_logcat.sh
          fi

      - name: Re-grant media permission after PermissionsDeniedE2ETest
        # The app is not reinstalled again before the remaining steps in this job (there
        # are none after this point today, but this keeps the device state honest for any
        # future step added after this one), so explicitly restore the default granted
        # state that every other E2E suite assumes.
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          "$ANDROID_HOME/platform-tools/adb" shell pm grant com.gb4pc android.permission.READ_MEDIA_IMAGES

      - name: Upload permissions-denied E2E markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-permissions-denied
          path: results/e2e-permissions-denied.ndjson
          retention-days: 14

      - name: Run SetupActivityGrantedE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # Issue #509/#566 follow-up (PR #564 review): an earlier attempt folded this
        # assertion into PermissionsGrantedE2ETest using createEmptyComposeRule() plus
        # a manually launched ActivityScenario for SetupActivity. That combination let
        # this exact test pass, but only because assertDoesNotExist() vacuously
        # succeeds when Compose's test framework finds no hierarchy at all to search
        # (see SetupActivityGrantedE2ETest's class doc). This dedicated step uses
        # createAndroidComposeRule<SetupActivity>() instead, the same rule
        # SetupActivityTest already relies on successfully, so the hierarchy is
        # actually found and the assertion is meaningful.
        id: run_setup_activity_granted_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.SetupActivityGrantedE2ETest \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-setup-activity-granted.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
              bash scripts/filter_logcat.sh
          fi

      - name: Upload SetupActivityGrantedE2ETest markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-setup-activity-granted
          path: results/e2e-setup-activity-granted.ndjson
          retention-days: 14

      - name: Run SetupActivityDeniedE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # -PmediaPermissionGranted=false, same as PermissionsDeniedE2ETest above and for
        # the same reason: this class asserts the permission is NOT granted, so it must
        # never run under the task's default grant.
        id: run_setup_activity_denied_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.SetupActivityDeniedE2ETest \
            -PmediaPermissionGranted=false \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-setup-activity-denied.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | \
              bash scripts/filter_logcat.sh
          fi

      - name: Re-grant media permission after SetupActivityDeniedE2ETest
        # Mirrors the "Re-grant media permission after PermissionsDeniedE2ETest" step
        # above: keeps device state in the "granted" baseline every other suite (and
        # any future step) assumes.
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          "$ANDROID_HOME/platform-tools/adb" shell pm grant com.gb4pc android.permission.READ_MEDIA_IMAGES

      - name: Upload SetupActivityDeniedE2ETest markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-setup-activity-denied
          path: results/e2e-setup-activity-denied.ndjson
          retention-days: 14

      - name: Run SetupActivityPermissionDialogE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # Issue #575: drives the REAL system Photos & Media permission dialog, then taps
        # "Allow all" via UI Automator. -PmediaPermissionGranted=false makes
        # connectedE2EAndroidTest's doLast block `pm revoke` READ_MEDIA_IMAGES before
        # `am instrument` starts the com.gb4pc process, so the MEDIA step is actually
        # reached (same as the two denied-precondition suites above).
        #
        # This is the one E2E suite whose action theoretically could kill its own instrumented
        # process: granting a storage-group runtime permission to a running app can make Android
        # restart it to re-mount scoped storage, and commit e5d37ed reproduced exactly that via the
        # out-of-band `pm grant`. This suite's first real CI execution (a `workflow_dispatch` run,
        # since this PR's base is a feature branch and the `pull_request` trigger above is scoped
        # to `branches: [main]`) settled whether the standard requestPermissions() dialog has the
        # same effect: it does not. The in-process assertions ran and passed directly, with
        # com.gb4pc staying alive throughout, so the recovery path described below was not
        # exercised on that run.
        #
        # Because `am instrument` self-instruments (test code runs inside com.gb4pc), a restart
        # would still tear down the instrumentation mid-test if one ever happens (e.g. after a
        # future Android version change). So this step still diagnoses a non-zero Gradle exit from
        # OUTSIDE the process, host-side and immune to com.gb4pc dying, as a safety net: a genuine
        # in-process assertion failure emits a FAIL marker and fails the build.
        #
        # A torn-down run (no terminal marker) whose grant nonetheless landed (`dumpsys
        # package` confirms granted=true) is not enough evidence on its own: that signature
        # cannot tell "the process died for the expected scoped-storage remount" apart from
        # "the process died from an unrelated regression that happens to land right after
        # the grant is recorded"--both leave the same granted=true snapshot. So this case
        # additionally verifies the flow recovers without losing progress, per the issue's
        # "if the app does restart, capture what happens next": it relaunches SetupActivity
        # host-side and confirms, via a UI Automator dump, that it lands on BATTERY (the
        # next ungranted step) rather than reverting to MEDIA or failing to render. Only
        # when that recovery is confirmed is the run reported as the documented "the dialog
        # grant restarts the app but succeeds" finding.
        id: run_setup_activity_permission_dialog_e2e
        if: steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          PID_BEFORE=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
          echo "com.gb4pc pid before dialog grant: '${PID_BEFORE:-<not running>}'"
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.SetupActivityPermissionDialogE2ETest \
            -PmediaPermissionGranted=false \
            | tee /tmp/e2e-permission-dialog.log \
              >(grep '^##GB4PC_TEST##' > results/e2e-setup-activity-permission-dialog.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            # Gradle exited non-zero. Diagnose host-side, immune to com.gb4pc having died.
            echo "=== SetupActivityPermissionDialogE2ETest: non-zero Gradle exit; host-side diagnosis ==="
            PID_AFTER=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
            echo "com.gb4pc pid after dialog grant:  '${PID_AFTER:-<not running>}'"
            GRANT_LINE=$("$ADB" shell dumpsys package com.gb4pc | tr -d '\r' \
              | grep 'READ_MEDIA_IMAGES: granted=' | head -n1 | sed 's/^ *//' || true)
            echo "host-side READ_MEDIA_IMAGES state: '${GRANT_LINE:-<not found>}'"
            if grep -q '"outcome":"FAIL"' results/e2e-setup-activity-permission-dialog.ndjson 2>/dev/null; then
              # The instrumented process lived long enough to report an assertion failure:
              # a genuine test failure, not a process restart. Fail the build.
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/filter_logcat.sh
            elif echo "$GRANT_LINE" | grep -q 'granted=true'; then
              # No terminal marker was emitted, so the instrumentation was torn down before it
              # could report--consistent with the media grant restarting com.gb4pc mid-test--
              # and the grant itself SUCCEEDED (confirmed host-side). Capture logcat now: this
              # torn-down-but-granted outcome is the single most interesting result the whole
              # test exists to characterize, so it must not go undocumented the way the two
              # other (unambiguous) failure branches above already capture it.
              echo "FINDING: the real Photos & Media dialog grant tore down the instrumented"
              echo "         com.gb4pc process (pid before='${PID_BEFORE:-<none>}',"
              echo "         after='${PID_AFTER:-<none>}'), but READ_MEDIA_IMAGES is now granted."
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/filter_logcat.sh

              # A confirmed grant alone does not establish that setup progress survived the
              # restart: an unrelated regression that happens to crash com.gb4pc right after
              # the grant lands would produce this exact same granted=true/no-marker signature.
              # Distinguish the two by relaunching SetupActivity from the host and checking,
              # via a UI Automator dump, that it actually lands on BATTERY (the next
              # still-ungranted step per SetupStep's NOTIFICATION/MEDIA/USAGE_ACCESS/OVERLAY/
              # BATTERY order, since connectedE2EAndroidTest's doLast grants everything except
              # battery-optimization exclusion) rather than reverting to MEDIA or failing to
              # render at all.
              echo "=== Verifying the setup flow recovers without losing progress ==="
              "$ADB" wait-for-device
              RECOVERED_PID=""
              for _ in $(seq 1 10); do
                RECOVERED_PID=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
                [[ -n "$RECOVERED_PID" ]] && break
                sleep 1
              done
              echo "com.gb4pc pid after recovery wait: '${RECOVERED_PID:-<not running>}'"
              # This suite runs last in the job (see scripts/setup-e2e-emulator.sh's step 8 and
              # SetupActivityDeniedE2ETest's class doc), so the PIN-secured keyguard the setup
              # script configures can have re-engaged by the time this recovery relaunch runs. A
              # swipe-only dismissal does nothing against it; replay the same PIN-aware sequence
              # E2EFixture.dismissSecureKeyguard() and the setup script's step 8 use. This runs
              # host-side (the instrumented process may be dead), so the Kotlin helper itself
              # cannot be called; the shell sequence is replayed directly instead.
              "$ADB" shell input keyevent KEYCODE_WAKEUP
              "$ADB" shell wm dismiss-keyguard
              "$ADB" shell input text 1234
              "$ADB" shell input keyevent 66
              sleep 2
              "$ADB" shell am start -n com.gb4pc/com.gb4pc.ui.setup.SetupActivity
              sleep 3
              "$ADB" shell uiautomator dump /sdcard/e2e-recovery-dump.xml > /dev/null 2>&1 || true
              RECOVERY_DUMP=$("$ADB" shell cat /sdcard/e2e-recovery-dump.xml 2>/dev/null || true)
              if echo "$RECOVERY_DUMP" | grep -q 'Battery Optimization' \
                && ! echo "$RECOVERY_DUMP" | grep -q 'Photos &amp; Media'; then
                echo "CONFIRMED: relaunching SetupActivity lands on the BATTERY step and MEDIA"
                echo "           is not shown again, so the grant survived the restart and no"
                echo "           setup progress was lost."
                echo "outcome=success" >> "$GITHUB_OUTPUT"
              else
                echo "REGRESSION: relaunching SetupActivity did not land cleanly on the BATTERY"
                echo "            step after the restart (dump snippet:"
                echo "            $(echo "$RECOVERY_DUMP" | tr -d '\n' | head -c 500)). Either"
                echo "            the flow reverted to MEDIA or failed to render, so the crash"
                echo "            was not the benign, expected scoped-storage restart."
                echo "outcome=failure" >> "$GITHUB_OUTPUT"
              fi
            else
              # Non-zero exit with neither a reported failure nor a confirmed grant: treat as a
              # real failure (e.g. the dialog never appeared, or the grant did not land).
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/filter_logcat.sh
            fi
          fi

      - name: Upload SetupActivityPermissionDialogE2ETest markers
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testresults-e2e-setup-activity-permission-dialog
          path: results/e2e-setup-activity-permission-dialog.ndjson
          retention-days: 14

      - name: Copy E2E test results
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        continue-on-error: true
        run: |
          # The E2E Gradle task writes TEST-com.gb4pc.e2e.*.xml into the shared
          # connected/debug directory (alongside the earlier instrumented results).
          # Snapshot only the E2E XML into a dedicated directory so the summary
          # and issue-filing pipelines see E2E results without the instrumented
          # ones mixed in.
          mkdir -p app/build/outputs/androidTest-results/e2e
          cp -r app/build/outputs/androidTest-results/connected/debug/TEST-com.gb4pc.e2e.*.xml \
            app/build/outputs/androidTest-results/e2e/

      - name: Pull and upload E2E screenshots on failure
        id: pull_e2e_screenshots
        if: always() && steps.diff_check.outputs.needs_full_build == 'true' && (steps.run_overlay_e2e.outputs.outcome == 'failure' || steps.run_gallery_e2e.outputs.outcome == 'failure')
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/e2e-screenshots
          "$ADB" pull /sdcard/Android/data/com.gb4pc/files/screenshots/ \
            /tmp/e2e-screenshots/ || echo "No screenshots to pull (directory may not exist)"

      - name: Kill emulator
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          $ANDROID_HOME/platform-tools/adb emu kill 2>/dev/null || true
          [[ -n "${EMULATOR_PID:-}" ]] && kill "$EMULATOR_PID" 2>/dev/null || true

      - name: Upload instrumented test results
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/instrumented/
          retention-days: 14

      - name: Upload E2E test results
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: app/build/outputs/androidTest-results/e2e/
          retention-days: 14

      - name: OCR on E2E screenshots
        if: always() && steps.pull_e2e_screenshots.outcome == 'success'
        run: |
          sudo apt-get install -y tesseract-ocr > /dev/null 2>&1
          chmod +x scripts/ocr_screenshots.sh
          scripts/ocr_screenshots.sh /tmp/e2e-screenshots

      - name: Upload E2E screenshots on failure
        if: always() && steps.pull_e2e_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: /tmp/e2e-screenshots/
          retention-days: 14

      - name: Write test-result summary
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          python3 scripts/summarize_test_results.py \
            app/build/test-results/testDebugUnitTest \
              --suite-label "Unit Tests" \
            app/build/outputs/androidTest-results/instrumented \
              --suite-label "Instrumented Tests" \
              --outcome "${{ steps.run_instrumented.outcome }}" \
            app/build/outputs/androidTest-results/e2e \
              --suite-label "E2E Tests" \
              --outcome "${{ (steps.run_overlay_e2e.outcome == 'skipped' && steps.run_gallery_e2e.outcome == 'skipped' && steps.run_permissions_granted_e2e.outcome == 'skipped' && steps.run_permissions_denied_e2e.outcome == 'skipped' && steps.run_setup_activity_granted_e2e.outcome == 'skipped' && steps.run_setup_activity_denied_e2e.outcome == 'skipped' && steps.run_setup_activity_permission_dialog_e2e.outcome == 'skipped') && 'skipped' || ((steps.run_overlay_e2e.outcome == 'failure' || steps.run_gallery_e2e.outcome == 'failure' || steps.run_permissions_granted_e2e.outcome == 'failure' || steps.run_permissions_denied_e2e.outcome == 'failure' || steps.run_setup_activity_granted_e2e.outcome == 'failure' || steps.run_setup_activity_denied_e2e.outcome == 'failure' || steps.run_setup_activity_permission_dialog_e2e.outcome == 'failure') && 'failure' || 'success') }}"

      # Single authority on whether the test phase passed (issue #309). Replaces
      # the old blanket `continue-on-error` on the test steps: any failing test
      # fails the build EXCEPT those named in .github/allowed-test-failures.txt
      # (a temporary red-to-green allowlist). The --outcome flags carry each test
      # step's real exit status, so a step that broke without writing a failing
      # test result (e.g. the `date` breakage in #307) is reported as an
      # infrastructure failure and still fails the build. This runs last so it
      # cannot suppress artifact upload, the summary, or issue filing.
      - name: Gate on test failures
        if: always() && steps.diff_check.outputs.needs_full_build == 'true'
        run: |
          python3 scripts/check_allowed_failures.py \
            --allowlist .github/allowed-test-failures.txt \
            app/build/test-results/testDebugUnitTest \
              --suite-label "Unit Tests" \
            app/build/outputs/androidTest-results/instrumented \
              --suite-label "Instrumented Tests" \
              --outcome "${{ steps.run_instrumented.outputs.outcome }}" \
            app/build/outputs/androidTest-results/e2e \
              --suite-label "E2E Tests" \
              --outcome "${{ (steps.run_overlay_e2e.outputs.outcome == 'failure' || steps.run_gallery_e2e.outputs.outcome == 'failure' || steps.run_permissions_granted_e2e.outputs.outcome == 'failure' || steps.run_permissions_denied_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_granted_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_denied_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_permission_dialog_e2e.outputs.outcome == 'failure') && 'failure' || 'success' }}"

  file-issues:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always() && needs.build-and-test.result != 'cancelled'
    permissions:
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download unit test results
        uses: actions/download-artifact@v7
        with:
          name: unit-test-results
          path: downloaded-artifacts/unit-test-results
        continue-on-error: true

      - name: Download E2E test results
        uses: actions/download-artifact@v7
        with:
          name: e2e-test-results
          path: downloaded-artifacts/e2e-test-results
        continue-on-error: true

      - name: Download instrumented test results
        uses: actions/download-artifact@v7
        with:
          name: instrumented-test-results
          path: downloaded-artifacts/instrumented-test-results
        continue-on-error: true

      - name: Install Python script dependencies
        run: pip install -r scripts/requirements.txt

      - name: File issues for failed tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_SHA: ${{ github.sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_RUN_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 scripts/file_test_failure_issues.py \
            downloaded-artifacts/unit-test-results \
              --suite-label "Unit Tests" \
            downloaded-artifacts/instrumented-test-results \
              --suite-label "Instrumented Tests" \
            downloaded-artifacts/e2e-test-results \
              --suite-label "E2E Tests"

  # Surface the build-and-test job's pass/fail summary directly on the PR
  # (issue #331): post or update a sticky comment linking to the job's
  # "Summary" section, e.g. .../actions/runs/<run_id>#summary-<job_id>.
  # Reviewers can then jump straight to the test summary instead of hunting
  # through the Checks tab. Runs regardless of build outcome so the link is
  # always available, including on red builds.
  #
  # Docs-only PRs skip the "Write test-result summary" step entirely (see
  # needs_full_build), so the job's "Summary" section has nothing to link to;
  # SUMMARY_WRITTEN tells the script to say so rather than post a misleading
  # link.
  link-pr-to-ci-summary:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && needs.build-and-test.result != 'cancelled'
    permissions:
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Post CI summary link on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_PR_URL: ${{ github.event.pull_request.html_url }}
          SUMMARY_WRITTEN: ${{ needs.build-and-test.outputs.needs_full_build }}
        run: python3 scripts/post_pr_ci_summary_link.py

  # Produce a signed release-config APK on every merge to main for easy sideloading.
  # Named gb4pc-dev.<run_number>.apk to distinguish from tagged releases.
  # Waits for the full test suite (unit + E2E) before producing an artifact.
  dev-build:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release-config APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PversionName=dev.${{ github.run_number }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
             app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          name: gb4pc-dev.${{ github.run_number }}
          path: app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk
          retention-days: 14
