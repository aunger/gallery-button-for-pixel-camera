name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Gate for PRs and merges: compiles, runs unit tests, then E2E tests on an emulator.
  # Unit tests run first so a fast failure skips the slower emulator phase.
  # On success the single debug build is reused for both test suites.
  #
  # E2E background: the real Pixel Camera APK refuses to start on non-Pixel emulators
  # (PairIP device-compatibility check). The e2e-mock-camera module has the same
  # applicationId ("com.google.android.GoogleCamera") and opens the camera hardware
  # on resume, so GB4PC's CameraManager callback and UsageStats-based foreground
  # detection are exercised identically to the real app.
  #
  # We manage the emulator lifecycle ourselves rather than using
  # reactivecircus/android-emulator-runner@v2 because the runner action
  # unconditionally runs `adb shell input keyevent 82` immediately after
  # sys.boot_completed=1, before system services accept binder connections on
  # the slow API-35 emulator — causing exit code 224 (Broken Pipe) before our
  # script ever starts. The explicit steps below poll for true service readiness.
  build-and-test:
    # ubuntu-latest has KVM hardware acceleration (available since April 2024).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for non-docs changes
        id: diff_check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Always build on direct pushes to main (e.g. merge commits).
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v '\.md$' || true)
            echo "has_code_changes=$([ -n "$CHANGED" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.diff_check.outputs.has_code_changes == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.diff_check.outputs.has_code_changes == 'true'
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        if: steps.diff_check.outputs.has_code_changes == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        if: steps.diff_check.outputs.has_code_changes == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install emulator, system image, and create AVD
        if: steps.diff_check.outputs.has_code_changes == 'true'
        run: |
          sdkmanager --install \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          # Pin AVD home to a stable path so both avdmanager and the emulator
          # agree on where AVDs live, regardless of what android-actions sets.
          AVD_HOME="$HOME/.android/avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> $GITHUB_ENV

          echo "==> Creating AVD (ANDROID_AVD_HOME=$AVD_HOME)..."
          echo "no" | avdmanager create avd \
            --name e2e_avd \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 \
            --force

          echo "==> AVD directory contents:"
          ls -la "$AVD_HOME/" || echo "(empty or missing)"

          echo "==> emulator -list-avds:"
          ANDROID_AVD_HOME="$AVD_HOME" $ANDROID_HOME/emulator/emulator -list-avds

      - name: Grant execute permission for gradlew
        if: steps.diff_check.outputs.has_code_changes == 'true'
        run: chmod +x gradlew

      - name: Build and run unit tests
        if: steps.diff_check.outputs.has_code_changes == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          ./gradlew assembleDebug assembleDebugAndroidTest :e2e-mock-camera:assembleDebug
          testDebugUnitTest -PversionName=dev.${{ github.run_number }} --no-daemon

      - name: Upload unit test results
        if: always() && steps.diff_check.outputs.has_code_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Start emulator
        if: steps.diff_check.outputs.has_code_changes == 'true'
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === KVM device:"
          ls -la /dev/kvm || echo "WARNING: /dev/kvm not found"

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Available AVDs:"
          $ANDROID_HOME/emulator/emulator -list-avds

          $ANDROID_HOME/emulator/emulator \
            -avd e2e_avd \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            > /tmp/emulator.log 2>&1 &
          EMUPID=$!
          echo "EMULATOR_PID=$EMUPID" >> $GITHUB_ENV
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Emulator launched (PID=$EMUPID)"

          # Give it 5 seconds to detect an immediate crash
          sleep 5
          if ! kill -0 "$EMUPID" 2>/dev/null; then
            echo "ERROR: Emulator process already exited!" >&2
            echo "=== Emulator log ===" >&2
            cat /tmp/emulator.log >&2
            exit 1
          fi
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Emulator process alive."

      # Poll for true service readiness — not just sys.boot_completed=1.
      # sys.boot_completed is set while binder threads are still saturated;
      # we wait until `settings` actually responds before issuing any commands.
      - name: Wait for emulator service readiness
        if: steps.diff_check.outputs.has_code_changes == 'true'
        timeout-minutes: 10
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for ADB device (timeout 1200s)..."
          timeout 1200 "$ADB" wait-for-device || {
            echo "ERROR: Emulator did not appear on ADB after 1200s" >&2
            echo "=== Emulator log (last 80 lines) ===" >&2
            tail -80 /tmp/emulator.log >&2
            exit 1
          }

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for sys.boot_completed=1..."
          until [[  "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            sleep 5
          done
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Boot flag set."

          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Waiting for settings service..."
          SVCWAIT=0
          until "$ADB" shell settings get global airplane_mode_on > /dev/null 2>&1; do
            if [[ $SVCWAIT -ge 120 ]]; then
              echo "ERROR: Services not ready after 120s post-boot." >&2
              exit 1
            fi
            sleep 5
            SVCWAIT=$((SVCWAIT + 5))
            echo "  ...not ready yet (${SVCWAIT}s since boot flag)"
          done
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') === Services ready (${SVCWAIT}s after boot flag)."

          # Wake, unlock, keep on, and disable animations now that services are up.
          # KEYCODE_WAKEUP (224) is more reliable than KEYCODE_MENU (82) for waking
          # the display from sleep; KEYCODE_MENU then dismisses the lock screen.
          "$ADB" shell input keyevent 224
          "$ADB" shell input keyevent 82
          # Prevent the screen from sleeping while the emulator is "plugged in"
          # (value 7 = stay on for AC/USB/wireless charging combined).
          # Without this the screen can time out between the unlock here and the
          # `am start` in the pre-flight step, preventing the activity window from
          # appearing over the lock screen.
          "$ADB" shell settings put global stay_on_while_plugged_in 7
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0

      - name: CI pre-flight — green-feed smoke check
        if: steps.diff_check.outputs.has_code_changes == 'true'
        id: preflight
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Capture a screenshot on any exit (including timeout) so the artifact
          # upload step always has a file to upload on failure.
          capture_screenshot() {
            echo "==> Capturing screen (trap on exit)..."
            "$ADB" exec-out screencap -p > preflight.png 2>/dev/null || true
          }
          trap capture_screenshot EXIT

          # Install mock Pixel Camera and grant CAMERA permission before the smoke check.
          echo "==> Installing mock Pixel Camera for pre-flight check..."
          "$ADB" install -r \
            e2e-mock-camera/build/outputs/apk/debug/e2e-mock-camera-debug.apk
          echo "==> Granting CAMERA permission..."
          "$ADB" shell pm grant com.google.android.GoogleCamera \
            android.permission.CAMERA

          # Wake the display and dismiss the keyguard before launching the activity.
          # am start -W waits for the framework to launch the activity, but on an
          # emulator with screen timeout the keyguard may still be covering the window.
          # wm dismiss-keyguard (API 26+) removes the keyguard immediately and is more
          # reliable than a keyevent sequence for this purpose.
          echo "==> Waking display and dismissing keyguard..."
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell wm dismiss-keyguard
          sleep 1

          # Launch MockCameraActivity and wait for it to be displayed.
          # am start -W blocks until the activity is on screen, so no polling needed.
          echo "==> Launching MockCameraActivity..."
          "$ADB" shell am start -W -n \
            com.google.android.GoogleCamera/com.gb4pc.mockcamera.MockCameraActivity

          # Give the View 3 seconds to render the green surface.
          sleep 3

          # Capture the screen and verify >= 90% of the central 200x200 px is #00C853.
          echo "==> Capturing screen..."
          "$ADB" exec-out screencap -p > preflight.png

          echo "==> Running green-feed smoke check..."
          if ! python3 scripts/check_green_feed.py preflight.png; then
            exit 1
          fi

      - name: Upload preflight screenshot on failure
        if: steps.diff_check.outputs.has_code_changes == 'true' && steps.preflight.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: preflight-screenshot
          path: preflight.png
          retention-days: 14

      - name: Run E2E setup and tests
        if: steps.diff_check.outputs.has_code_changes == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"

          chmod +x scripts/setup-e2e-emulator.sh
          # --post-boot skips AVD creation/boot. No pixel-camera.apkm exists so the
          # script's PC install step is skipped; we install the mock below instead.
          scripts/setup-e2e-emulator.sh --post-boot

          # Mock Pixel Camera is already installed (pre-flight step above).
          # Re-install is a no-op but ensures latest build is present.
          echo "==> Installing mock Pixel Camera..."
          "$ADB" install -r \
            e2e-mock-camera/build/outputs/apk/debug/e2e-mock-camera-debug.apk
          echo "==> Granting CAMERA permission to mock Pixel Camera..."
          "$ADB" shell pm grant com.google.android.GoogleCamera \
            android.permission.CAMERA

          echo "==> Mock PC resolve check:"
          "$ADB" shell pm resolve-activity --brief \
            -a android.media.action.STILL_IMAGE_CAMERA \
            -p com.google.android.GoogleCamera 2>/dev/null || true

          ./gradlew connectedE2EAndroidTest --no-daemon || {
            echo "=== LOGCAT (last 300 lines) ==="
            "$ADB" logcat -d | \
              grep -E "AndroidRuntime|FATAL|Process crashed|com\.gb4pc|OverlayService|MockCamera|CameraService|E/\w" | \
              tail -300
            exit 1
          }

      - name: Kill emulator
        if: always() && steps.diff_check.outputs.has_code_changes == 'true'
        run: |
          $ANDROID_HOME/platform-tools/adb emu kill 2>/dev/null || true
          [[ -n "${EMULATOR_PID:-}" ]] && kill "$EMULATOR_PID" 2>/dev/null || true

      - name: Upload E2E test results
        if: always() && steps.diff_check.outputs.has_code_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: app/build/outputs/androidTest-results/
          retention-days: 14

  # Produce a signed release-config APK on every merge to main for easy sideloading.
  # Named gb4pc-dev.<run_number>.apk to distinguish from tagged releases.
  # Waits for the full test suite (unit + E2E) before producing an artifact.
  dev-build:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release-config APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PversionName=dev.${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
             app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: gb4pc-dev.${{ github.run_number }}
          path: app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk
          retention-days: 14
