      - name: Run SetupActivityPermissionDialogE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # Issue #575: drives the REAL system Photos & Media permission dialog, then taps
        # "Allow all" via UI Automator. -PmediaPermissionGranted=false makes
        # connectedE2EAndroidTest's doLast block `pm revoke` READ_MEDIA_IMAGES before
        # `am instrument` starts the com.gb4pc process, so the MEDIA step is actually
        # reached (same as the two denied-precondition suites above).
        #
        # This is the one E2E suite whose action theoretically could kill its own instrumented
        # process: granting a storage-group runtime permission to a running app can make Android
        # restart it to re-mount scoped storage, and commit e5d37ed reproduced exactly that via the
        # out-of-band `pm grant`. This suite's first real CI execution (a `workflow_dispatch` run,
        # since this PR's base is a feature branch and the `pull_request` trigger above is scoped
        # to `branches: [main]`) settled whether the standard requestPermissions() dialog has the
        # same effect: it does not. The in-process assertions ran and passed directly, with
        # com.gb4pc staying alive throughout, so the recovery path described below was not
        # exercised on that run.
        #
        # Because `am instrument` self-instruments (test code runs inside com.gb4pc), a restart
        # would still tear down the instrumentation mid-test if one ever happens (e.g. after a
        # future Android version change). So this step still diagnoses a non-zero Gradle exit from
        # OUTSIDE the process, host-side and immune to com.gb4pc dying, as a safety net: a genuine
        # in-process assertion failure emits a FAIL marker and fails the build.
        #
        # A torn-down run (no terminal marker) whose grant nonetheless landed (`dumpsys
        # package` confirms granted=true) is not enough evidence on its own: that signature
        # cannot tell "the process died for the expected scoped-storage remount" apart from
        # "the process died from an unrelated regression that happens to land right after
        # the grant is recorded"--both leave the same granted=true snapshot. So this case
        # additionally verifies the flow recovers without losing progress, per the issue's
        # "if the app does restart, capture what happens next": it relaunches SetupActivity
        # host-side and confirms, via a UI Automator dump, that it lands on BATTERY (the
        # next ungranted step) rather than reverting to MEDIA or failing to render. Only
        # when that recovery is confirmed is the run reported as the documented "the dialog
        # grant restarts the app but succeeds" finding.
        id: run_setup_activity_permission_dialog_e2e
        if: needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          # Start screen recording for this suite (issue #604), extending the
          # overlay/gallery suites' issue #520 pattern to every E2E suite. See the
          # overlay E2E step for the rationale on display-on-first, SIGINT-only stop,
          # and why the host-side adb shell wrapper must not be killed before muxer flush.
          # screenrecord runs as its own device-side process under `shell`, independent of
          # com.gb4pc, so it keeps recording even through this suite's own mid-test
          # teardown/restart of com.gb4pc (see the class doc); the stop-and-finalize block
          # below runs unconditionally, after every branch below, to cover that path too.
          "$ADB" shell screenrecord /sdcard/e2e-setup-activity-permission-dialog.mp4 &
          RECPID_SETUP_ACTIVITY_PERMISSION_DIALOG=$!
          sleep 1
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          PID_BEFORE=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
          echo "com.gb4pc pid before dialog grant: '${PID_BEFORE:-<not running>}'"
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.SetupActivityPermissionDialogE2ETest \
            -PmediaPermissionGranted=false \
            | tee /tmp/e2e-permission-dialog.log \
              >(grep '^##GB4PC_TEST##' > results/e2e-setup-activity-permission-dialog.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            # Gradle exited non-zero. Diagnose host-side, immune to com.gb4pc having died.
            echo "=== SetupActivityPermissionDialogE2ETest: non-zero Gradle exit; host-side diagnosis ==="
            PID_AFTER=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
            echo "com.gb4pc pid after dialog grant:  '${PID_AFTER:-<not running>}'"
            GRANT_LINE=$("$ADB" shell dumpsys package com.gb4pc | tr -d '\r' \
              | grep 'READ_MEDIA_IMAGES: granted=' | head -n1 | sed 's/^ *//' || true)
            echo "host-side READ_MEDIA_IMAGES state: '${GRANT_LINE:-<not found>}'"
            if grep -q '"outcome":"FAIL"' results/e2e-setup-activity-permission-dialog.ndjson 2>/dev/null; then
              # The instrumented process lived long enough to report an assertion failure:
              # a genuine test failure, not a process restart. Fail the build.
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/ci/test-support/filter_logcat.sh
            elif echo "$GRANT_LINE" | grep -q 'granted=true'; then
              # No terminal marker was emitted, so the instrumentation was torn down before it
              # could report--consistent with the media grant restarting com.gb4pc mid-test--
              # and the grant itself SUCCEEDED (confirmed host-side). Capture logcat now: this
              # torn-down-but-granted outcome is the single most interesting result the whole
              # test exists to characterize, so it must not go undocumented the way the two
              # other (unambiguous) failure branches above already capture it.
              echo "FINDING: the real Photos & Media dialog grant tore down the instrumented"
              echo "         com.gb4pc process (pid before='${PID_BEFORE:-<none>}',"
              echo "         after='${PID_AFTER:-<none>}'), but READ_MEDIA_IMAGES is now granted."
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/ci/test-support/filter_logcat.sh

              # A confirmed grant alone does not establish that setup progress survived the
              # restart: an unrelated regression that happens to crash com.gb4pc right after
              # the grant lands would produce this exact same granted=true/no-marker signature.
              # Distinguish the two by relaunching SetupActivity from the host and checking,
              # via a UI Automator dump, that it actually lands on BATTERY (the next
              # still-ungranted step per SetupStep's NOTIFICATION/MEDIA/USAGE_ACCESS/OVERLAY/
              # BATTERY order, since connectedE2EAndroidTest's doLast grants everything except
              # battery-optimization exclusion) rather than reverting to MEDIA or failing to
              # render at all.
              echo "=== Verifying the setup flow recovers without losing progress ==="
              "$ADB" wait-for-device
              RECOVERED_PID=""
              for _ in $(seq 1 10); do
                RECOVERED_PID=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
                [[ -n "$RECOVERED_PID" ]] && break
                sleep 1
              done
              echo "com.gb4pc pid after recovery wait: '${RECOVERED_PID:-<not running>}'"
              # This suite runs last in the job (see scripts/ci/test-support/setup-e2e-emulator.sh's step 9 and
              # SetupActivityDeniedE2ETest's class doc), so the PIN-secured keyguard the setup
              # script configures can have re-engaged by the time this recovery relaunch runs. A
              # swipe-only dismissal does nothing against it; replay the same PIN-aware sequence
              # E2EFixture.dismissSecureKeyguard() and the setup script's step 9 use. This runs
              # host-side (the instrumented process may be dead), so the Kotlin helper itself
              # cannot be called; the shell sequence is replayed directly instead.
              "$ADB" shell input keyevent KEYCODE_WAKEUP
              "$ADB" shell wm dismiss-keyguard
              "$ADB" shell input text 1234
              "$ADB" shell input keyevent 66
              sleep 2
              "$ADB" shell am start -n com.gb4pc/com.gb4pc.ui.setup.SetupActivity
              sleep 3
              "$ADB" shell uiautomator dump /sdcard/e2e-recovery-dump.xml > /dev/null 2>&1 || true
              RECOVERY_DUMP=$("$ADB" shell cat /sdcard/e2e-recovery-dump.xml 2>/dev/null || true)
              if echo "$RECOVERY_DUMP" | grep -q 'Battery Optimization' \
                && ! echo "$RECOVERY_DUMP" | grep -q 'Photos &amp; Media'; then
                echo "CONFIRMED: relaunching SetupActivity lands on the BATTERY step and MEDIA"
                echo "           is not shown again, so the grant survived the restart and no"
                echo "           setup progress was lost."
                echo "outcome=success" >> "$GITHUB_OUTPUT"
              else
                echo "REGRESSION: relaunching SetupActivity did not land cleanly on the BATTERY"
                echo "            step after the restart (dump snippet:"
                echo "            $(echo "$RECOVERY_DUMP" | tr -d '\n' | head -c 500)). Either"
                echo "            the flow reverted to MEDIA or failed to render, so the crash"
                echo "            was not the benign, expected scoped-storage restart."
                echo "outcome=failure" >> "$GITHUB_OUTPUT"
              fi
            else
              # Non-zero exit with neither a reported failure nor a confirmed grant: treat as a
              # real failure (e.g. the dialog never appeared, or the grant did not land).
              echo "outcome=failure" >> "$GITHUB_OUTPUT"
              echo "=== LOGCAT (since test start) ==="
              "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/ci/test-support/filter_logcat.sh
            fi
          fi
          # The grant-poll retry loop's diagnostic (issue #581) logs via the GB4PC_E2E tag only
          # when a retry actually happens (silence means the first tap registered), regardless of
          # whether the test itself ultimately passes or fails; the LOGCAT dump above only runs
          # on a non-zero Gradle exit. Pull any retry lines unconditionally, on every outcome, so
          # a retry that happened on an otherwise-green run is still visible.
          echo "=== Allow-all tap retry diagnostic (issue #581) ==="
          "$ADB" logcat -d -T "$LOGCAT_SINCE" -s GB4PC_E2E:W | grep -i "retrying" \
            || echo "  (no retry occurred; first tap registered)"
          # Stop screenrecord cleanly so the moov atom is written and the MP4 is playable.
          # Runs unconditionally after every branch above (including the torn-down/recovery
          # path): screenrecord is a separate device-side process under `shell`, so it is
          # unaffected by com.gb4pc's own mid-test restart and is still running here.
          echo "  stopping screenrecord (setup-activity-permission-dialog suite)"
          "$ADB" shell pkill -INT -x screenrecord 2>/dev/null || true
          echo "  waiting for screenrecord to finalize the MP4"
          for i in $(seq 1 30); do
            "$ADB" shell pidof screenrecord > /dev/null 2>&1 || break
            sleep 1
          done
          wait "$RECPID_SETUP_ACTIVITY_PERMISSION_DIALOG" 2>/dev/null || true

      - name: Pull SetupActivityPermissionDialogE2ETest video on failure
        # Only pull and upload the recording when this suite failed (issue #604).
        # On a green run the file is left on the device and discarded when the emulator exits.
        if: always() && needs.check-diff.outputs.needs_full_build == 'true' && steps.run_setup_activity_permission_dialog_e2e.outputs.outcome == 'failure'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/e2e-videos
          "$ADB" pull /sdcard/e2e-setup-activity-permission-dialog.mp4 /tmp/e2e-videos/e2e-setup-activity-permission-dialog.mp4 || \
            echo "WARNING: could not pull e2e-setup-activity-permission-dialog.mp4"

      - name: Upload SetupActivityPermissionDialogE2ETest video
        if: always() && needs.check-diff.outputs.needs_full_build == 'true' && steps.run_setup_activity_permission_dialog_e2e.outputs.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-video-SetupActivityPermissionDialogE2ETest
          path: /tmp/e2e-videos/e2e-setup-activity-permission-dialog.mp4
          retention-days: 14

      - name: Upload SetupActivityPermissionDialogE2ETest monitor feed
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-monitor-feed-SetupActivityPermissionDialogE2ETest
          path: results/e2e-setup-activity-permission-dialog.ndjson
          retention-days: 14

      - name: Run PartialAccessPhotoPickerE2ETest
        # No `continue-on-error` (issue #309): record the real outcome and defer
        # the pass/fail verdict to the "Gate on test failures" step.
        #
        # Issue #568 (H2): drives the REAL API 34+ "Select photos and videos" system photo
        # picker, rather than SetupActivityPermissionDialogE2ETest's "Allow all", and confirms
        # PermissionHelper.hasMediaPermission() treats the resulting partial
        # (READ_MEDIA_VISUAL_USER_SELECTED-only) grant as not granted, and that MainActivity's
        # banner and OverlayService's tap-to-fix notification still appear for it.
        # -PmediaPermissionGranted=false makes connectedE2EAndroidTest's doLast block `pm revoke`
        # READ_MEDIA_IMAGES before `am instrument` starts the com.gb4pc process, so the MEDIA
        # step is actually reached (same precondition as the denied/dialog suites above).
        id: run_partial_access_photo_picker_e2e
        if: needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell input swipe 300 1000 300 300
          sleep 2
          mkdir -p results
          set -o pipefail
          LOGCAT_SINCE=$("$ADB" shell "date '+%m-%d %H:%M:%S.000'" | tr -d '\r')
          PID_BEFORE=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
          echo "com.gb4pc pid before partial grant: '${PID_BEFORE:-<not running>}'"
          if ./gradlew connectedE2EAndroidTest \
            -Pe2eClass=com.gb4pc.e2e.PartialAccessPhotoPickerE2ETest \
            -PmediaPermissionGranted=false \
            | tee >(grep '^##GB4PC_TEST##' > results/e2e-partial-access-photo-picker.ndjson); then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
            # Issue #925: the system photo picker is this suite's slow step, and the run that
            # only just fits its budget looks exactly like the run that fits comfortably unless
            # the margin is printed. The test logs each picker wait under GB4PC_E2E, so surface
            # those lines on green runs too, and let a shrinking margin be seen before it becomes
            # the next flake rather than after.
            echo "=== PartialAccessPhotoPickerE2ETest: system photo picker wait margins ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | grep -E 'GB4PC_E2E.*picker ' \
              || echo "(no picker timing lines found in the logcat buffer)"
          else
            # Gradle exited non-zero. Diagnose host-side, immune to com.gb4pc having died.
            #
            # Unlike SetupActivityPermissionDialogE2ETest, this test's later assertions (the
            # MainActivity banner and the OverlayService notification) run *in-process, after* the
            # partial grant, so a grant that tore the process down is a genuine failure here, not a
            # documented success. This branch does NOT rescue such a run; it only makes the
            # torn-down-but-partially-granted signature legible instead of an opaque non-zero exit,
            # so a future regression of the "in-app dialog grant is non-fatal" assumption (see the
            # test's class doc) is diagnosable rather than mysterious.
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "=== PartialAccessPhotoPickerE2ETest: non-zero Gradle exit; host-side diagnosis ==="
            PID_AFTER=$("$ADB" shell pidof com.gb4pc | tr -d '\r' || true)
            echo "com.gb4pc pid after partial grant:  '${PID_AFTER:-<not running>}'"
            DUMP=$("$ADB" shell dumpsys package com.gb4pc | tr -d '\r' || true)
            SELECTED_LINE=$(echo "$DUMP" | grep 'READ_MEDIA_VISUAL_USER_SELECTED: granted=' | head -n1 | sed 's/^ *//' || true)
            IMAGES_LINE=$(echo "$DUMP" | grep 'READ_MEDIA_IMAGES: granted=' | head -n1 | sed 's/^ *//' || true)
            echo "host-side READ_MEDIA_VISUAL_USER_SELECTED state: '${SELECTED_LINE:-<not found>}'"
            echo "host-side READ_MEDIA_IMAGES state:               '${IMAGES_LINE:-<not found>}'"
            if ! grep -q '"outcome":"FAIL"' results/e2e-partial-access-photo-picker.ndjson 2>/dev/null \
              && echo "$SELECTED_LINE" | grep -q 'granted=true' \
              && echo "$IMAGES_LINE" | grep -q 'granted=false'; then
              echo "FINDING: no in-process test marker was emitted, yet the partial grant landed"
              echo "         host-side (READ_MEDIA_VISUAL_USER_SELECTED granted, READ_MEDIA_IMAGES"
              echo "         not). That signature means the READ_MEDIA_VISUAL_USER_SELECTED grant"
              echo "         tore down the instrumented com.gb4pc process mid-test (pid"
              echo "         before='${PID_BEFORE:-<none>}', after='${PID_AFTER:-<none>}'), so the"
              echo "         post-grant banner/notification assertions never ran. This contradicts"
              echo "         the in-app-dialog-grant-is-non-fatal assumption this test relies on"
              echo "         (see its class doc); that assumption needs revisiting for this"
              echo "         permission before the test can pass."
            fi
            echo "=== LOGCAT (since test start) ==="
            "$ADB" logcat -d -T "$LOGCAT_SINCE" | bash scripts/ci/test-support/filter_logcat.sh
          fi

      - name: Re-grant media permission after PartialAccessPhotoPickerE2ETest
        # Mirrors "Re-grant media permission after PermissionsDeniedE2ETest" above: this suite
        # leaves com.gb4pc with only partial (or no) media access, so restore the default
        # granted state every other E2E suite assumes, keeping device state honest for any
        # future step added after this one.
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          "$ANDROID_HOME/platform-tools/adb" shell pm grant com.gb4pc android.permission.READ_MEDIA_IMAGES

      - name: Upload PartialAccessPhotoPickerE2ETest monitor feed
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-monitor-feed-PartialAccessPhotoPickerE2ETest
          path: results/e2e-partial-access-photo-picker.ndjson
          retention-days: 14

      - name: Copy E2E test results
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        continue-on-error: true
        run: |
          # The E2E Gradle task writes TEST-com.gb4pc.e2e.*.xml into the shared
          # connected/debug directory (alongside the earlier instrumented results).
          # Snapshot only the E2E XML into a dedicated directory so the summary
          # and issue-filing pipelines see E2E results without the instrumented
          # ones mixed in.
          mkdir -p app/build/outputs/androidTest-results/e2e
          cp -r app/build/outputs/androidTest-results/connected/debug/TEST-com.gb4pc.e2e.*.xml \
            app/build/outputs/androidTest-results/e2e/

      - name: Pull and upload E2E screenshots on failure
        id: pull_e2e_screenshots
        if: always() && needs.check-diff.outputs.needs_full_build == 'true' && (steps.run_overlay_e2e.outputs.outcome == 'failure' || steps.run_gallery_e2e.outputs.outcome == 'failure')
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/e2e-screenshots
          "$ADB" pull /sdcard/Android/data/com.gb4pc/files/screenshots/ \
            /tmp/e2e-screenshots/ || echo "No screenshots to pull (directory may not exist)"

      - name: Kill emulator
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          $ANDROID_HOME/platform-tools/adb emu kill 2>/dev/null || true
          [[ -n "${EMULATOR_PID:-}" ]] && kill "$EMULATOR_PID" 2>/dev/null || true

      - name: Upload E2E timeout diagnostics
        # Issue #629: connectedE2EAndroidTest (app/build.gradle.kts) writes a UI Automator
        # screen dump and the full, unfiltered logcat buffer into
        # app/build/outputs/e2e-diagnostics/ only when its own 10-minute `am instrument`
        # timeout (issue #611/#628) fires, captured before force-stop tears the hung
        # activity down. Whichever E2E suite step (if any) hit that timeout is the only one
        # that would have populated the directory, so this single step runs unconditionally
        # after every suite rather than being duplicated per-suite; if-no-files-found:
        # ignore keeps the common (no timeout) case from warning.
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timeout-diagnostics
          path: app/build/outputs/e2e-diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload instrumented test results
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/instrumented/
          retention-days: 14

      - name: Upload E2E test results
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: app/build/outputs/androidTest-results/e2e/
          retention-days: 14

      - name: OCR on E2E screenshots
        if: always() && steps.pull_e2e_screenshots.outcome == 'success'
        run: |
          sudo apt-get install -y tesseract-ocr > /dev/null 2>&1
          chmod +x scripts/ci/test-support/ocr_screenshots.sh
          scripts/ci/test-support/ocr_screenshots.sh /tmp/e2e-screenshots

      - name: Upload E2E screenshots on failure
        if: always() && steps.pull_e2e_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: /tmp/e2e-screenshots/
          retention-days: 14

      - name: Write test-result summary
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          python3 scripts/ci/test-support/summarize_test_results.py \
            app/build/test-results/testDebugUnitTest \
              --suite-label "Unit Tests" \
            app/build/outputs/androidTest-results/instrumented \
              --suite-label "Instrumented Tests" \
              --outcome "${{ steps.run_instrumented.outcome }}" \
            app/build/outputs/androidTest-results/e2e \
              --suite-label "E2E Tests" \
              --outcome "${{ (steps.run_overlay_e2e.outcome == 'skipped' && steps.run_gallery_e2e.outcome == 'skipped' && steps.run_permissions_granted_e2e.outcome == 'skipped' && steps.run_permissions_denied_e2e.outcome == 'skipped' && steps.run_setup_activity_granted_e2e.outcome == 'skipped' && steps.run_setup_activity_denied_e2e.outcome == 'skipped' && steps.run_setup_activity_permission_dialog_e2e.outcome == 'skipped' && steps.run_partial_access_photo_picker_e2e.outcome == 'skipped') && 'skipped' || ((steps.run_overlay_e2e.outcome == 'failure' || steps.run_gallery_e2e.outcome == 'failure' || steps.run_permissions_granted_e2e.outcome == 'failure' || steps.run_permissions_denied_e2e.outcome == 'failure' || steps.run_setup_activity_granted_e2e.outcome == 'failure' || steps.run_setup_activity_denied_e2e.outcome == 'failure' || steps.run_setup_activity_permission_dialog_e2e.outcome == 'failure' || steps.run_partial_access_photo_picker_e2e.outcome == 'failure') && 'failure' || 'success') }}"

      # Single authority on whether the test phase passed (issue #309). Replaces
      # the old blanket `continue-on-error` on the test steps: any failing test
      # fails the build EXCEPT those named in .github/allowed-test-failures.txt
      # (a temporary red-to-green allowlist). The --outcome flags carry each test
      # step's real exit status, so a step that broke without writing a failing
      # test result (e.g. the `date` breakage in #307) is reported as an
      # infrastructure failure and still fails the build. This runs last so it
      # cannot suppress artifact upload, the summary, or issue filing.
      - name: Gate on test failures
        if: always() && needs.check-diff.outputs.needs_full_build == 'true'
        run: |
          python3 scripts/ci/test-support/check_allowed_failures.py \
            --allowlist .github/allowed-test-failures.txt \
            app/build/test-results/testDebugUnitTest \
              --suite-label "Unit Tests" \
            app/build/outputs/androidTest-results/instrumented \
              --suite-label "Instrumented Tests" \
              --outcome "${{ steps.run_instrumented.outputs.outcome }}" \
            app/build/outputs/androidTest-results/e2e \
              --suite-label "E2E Tests" \
              --outcome "${{ (steps.run_overlay_e2e.outputs.outcome == 'failure' || steps.run_gallery_e2e.outputs.outcome == 'failure' || steps.run_permissions_granted_e2e.outputs.outcome == 'failure' || steps.run_permissions_denied_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_granted_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_denied_e2e.outputs.outcome == 'failure' || steps.run_setup_activity_permission_dialog_e2e.outputs.outcome == 'failure' || steps.run_partial_access_photo_picker_e2e.outputs.outcome == 'failure') && 'failure' || 'success' }}"

  file-issues:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always() && needs.build-and-test.result != 'cancelled'
    permissions:
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download unit test results
        uses: actions/download-artifact@v7
        with:
          name: unit-test-results
          path: downloaded-artifacts/unit-test-results
        continue-on-error: true

      - name: Download E2E test results
        uses: actions/download-artifact@v7
        with:
          name: e2e-test-results
          path: downloaded-artifacts/e2e-test-results
        continue-on-error: true

      - name: Download instrumented test results
        uses: actions/download-artifact@v7
        with:
          name: instrumented-test-results
          path: downloaded-artifacts/instrumented-test-results
        continue-on-error: true

      - name: Install Python script dependencies
        # --require-hashes refuses any artifact whose SHA-256 is not in the
        # generated lock scripts/requirements.txt (issue #723; see
        # scripts/requirements.in for the top-level pins). --force-reinstall
        # matches the session-start hook's installer (issue #810).
        run: pip install --force-reinstall --require-hashes -r scripts/requirements.txt

      - name: File issues for failed tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_SHA: ${{ github.sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_RUN_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 scripts/ci/prs-and-issues/file_test_failure_issues.py \
            downloaded-artifacts/unit-test-results \
              --suite-label "Unit Tests" \
            downloaded-artifacts/instrumented-test-results \
              --suite-label "Instrumented Tests" \
            downloaded-artifacts/e2e-test-results \
              --suite-label "E2E Tests"

  # Reserve the first PR comment for CI status updates (issue #561): as soon
  # as the PR is opened, post a placeholder comment carrying the same hidden
  # marker link-pr-to-ci-summary looks for. That job's find-or-update logic
  # then edits this placeholder in place once real results are ready, instead
  # of creating a late comment (the build-and-test job can take a long time)
  # that lands after human review comments have already piled up.
  reserve-ci-summary-comment:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post placeholder CI summary comment
        uses: actions/github-script@v9
        with:
          script: |
            // This marker must stay in lockstep with MARKER in
            // scripts/ci/prs-and-issues/post_pr_ci_summary_link.py, which scans for it to find
            // this comment and edit it in place once real CI results are ready.
            const marker = '<!-- gb4pc-ci-summary-link -->';

            // A manual "Re-run all jobs" replays this job even though the
            // stored trigger event is still 'opened', so guard against
            // posting a second placeholder alongside one that already exists.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              console.log('A CI summary comment already exists; skipping placeholder.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n### CI test summary\n\nCI has not reported results yet.\n`,
            });

  # Surface the build-and-test job's pass/fail summary directly on the PR
  # (issue #331): post or update a sticky comment linking to the job's
  # "Summary" section, e.g. .../actions/runs/<run_id>#summary-<job_id>.
  # Reviewers can then jump straight to the test summary instead of hunting
  # through the Checks tab. Runs regardless of build outcome so the link is
  # always available, including on red builds.
  #
  # Docs-only PRs skip the "Write test-result summary" step entirely (see
  # needs_full_build), so the job's "Summary" section has nothing to link to;
  # SUMMARY_WRITTEN tells the script to say so rather than post a misleading
  # link.
  link-pr-to-ci-summary:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && needs.build-and-test.result != 'cancelled'
    permissions:
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Post CI summary link on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_PR_URL: ${{ github.event.pull_request.html_url }}
          SUMMARY_WRITTEN: ${{ needs.build-and-test.outputs.needs_full_build }}
        run: python3 scripts/ci/prs-and-issues/post_pr_ci_summary_link.py

  # Produce a signed release-config APK on every merge to main for easy sideloading.
  # Named gb4pc-dev.<run_number>.apk to distinguish from tagged releases.
  # Waits for the full test suite (unit + E2E) before producing an artifact.
  dev-build:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release-config APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PversionName=dev.${{ github.run_number }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
             app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          name: gb4pc-dev.${{ github.run_number }}
          path: app/build/outputs/apk/release/gb4pc-dev.${{ github.run_number }}.apk
          retention-days: 14
