name: Administrative merge holds

# One job, two steps, run in this order, each a vcs-automation action:
#
#   1. Enforce mutually exclusive label sets (issues and pull requests,
#      `labeled` only; enforce-mutually-exclusive-labels). When a label
#      belonging to a mutually exclusive set is added, removes any other label
#      from the same set, so that at most one member of each set is present at
#      any time. The sets are the `exclusive-sets` and `exclusive-prefixes`
#      inputs below. If the added label is already gone when the step reads
#      the labels, it removes nothing (the script this job ran before the
#      action removed the siblings anyway), which can leave a blocking label
#      in place: the safe direction for step 2.
#
#   2. "Red to hold merge, not a failure" (pull requests only;
#      check-blocking-labels). Fails the job, and with it the required status
#      check named after the job, whenever a blocking label (the
#      `blocking-labels` input) is present on any open PR whose head is this
#      commit, preventing merge until the label is removed.
#
# The tables pair with the orchestrate plugin's label protocol: vcs-automation's
# README, section "The merge gate and orchestrate's labels", gives the wiring.
# The `verification needed`/`verified` and `changes requested`/`changes done`
# pairs are deliberately separate sets, not one. They track independent
# things: the first pair is the state of the before-merging requirements, and
# the second is the state of the Author/Reviewer round. Merging them would rule
# out states that are coherent, and would open a hole in the merge gate:
#   - `verified` + `changes requested`: a Reviewer asks for changes on a PR
#     that is still verified for its current head. Adding `changes requested`
#     would strip `verified` for no reason (remove-verified-on-push.yml already
#     clears it when a push makes it stale).
#   - `verification needed` + `changes requested`/`changes done`: manual
#     before-merging items are still open while a code round runs. A shared
#     set would let either side's label drop the other's, losing either the
#     record that those items are open or the record of where the round stands.
#   - Merge gate: `verified` does not block merging, but the other three labels
#     do. Adding `verified` to a PR carrying `changes requested` or
#     `changes done` would remove a blocking label, and outside an
#     orchestration run no other label holds the gate closed.
# The last set is the snooze ladder, which snooze-issues.yml and
# wake-snoozed-issues.yml read too. propagate-issue-labels.yml and
# reconcile-issue-labels.yml take the same sets and prefixes;
# scripts/ci/test_label_tables.py fails when the copies differ.
#
# Enforcement runs first because it can remove a blocking label: adding
# `verified` drops `verification needed`, and adding `orchestrate` drops
# `orchestrating`. A removal made with GITHUB_TOKEN starts no new workflow run,
# so a verdict computed before it would stand until some later event. That is
# also why step 1 reports the labels it removed (its `removed` output), and
# step 2 drops exactly those from the event-payload labels, which were
# captured before step 1 ran. Every other payload label still counts, so the
# label that fired a `labeled` event is never lost to a lagging API read.
#
# A red job therefore means one of two things, told apart by the step icons:
# step 2 red is a deliberate hold; step 1 red is a broken enforcement run,
# which also holds the merge rather than hiding behind a green job (issue
# #1241). Step 2 is skipped after a step 1 failure; the job is red either way.
# One routine way step 1 goes red: on a fork PR, GITHUB_TOKEN is read-only
# whatever `permissions:` asks for, so a removal there fails with a 403 and
# the merge is held until a later event re-runs the job.
# Skipped steps are routine here: step 1 is skipped on every event but
# `labeled`, and step 2 on every issue event.
#
# Step 2 asks its question about the *commit*, not about the PR that fired the
# event, because that is what the answer is stored against: a check run
# attaches to a head commit, and GitHub evaluates a required check by taking
# the most recent run of that check name on that commit, regardless of which
# PR produced it. Reading only the triggering PR's labels therefore let two
# open PRs sharing a head commit answer for each other, and
# the orchestrate plugin's Verifier live-fire recipe manufactured exactly that collision
# on PRs that were mid-verification (issue #833). The docstring of
# vcs-automation's check-blocking-labels/check_blocking_labels.py has the full
# rationale.
#
# Every pull request event that can change a commit's verdict, and that fires
# a run against that commit, is a trigger. Both halves are narrower than "all
# pull_request events", so this list is not the full set and does not keep
# every stored verdict current:
#   - `edited`, `ready_for_review`, `converted_to_draft` and the rest cannot
#     change the verdict, so they are deliberately absent.
#   - A force-push does change the set of PRs at the commit it leaves behind,
#     but the run it fires lands on the pusher's new head, so the abandoned
#     commit keeps the verdict it already had. That is the `closed` case below
#     without an event that can fix it, and it is not addressed here.
#
# The pull request events that are listed:
#   - opened / reopened / synchronize: ensure fresh PRs are blocked from the start.
#   - labeled / unlabeled: re-evaluate immediately when the label changes.
#   - closed: closing a PR removes it from the set the gate considers, so
#     closing one can be exactly what unblocks a commit. The gate's observable
#     state is the stored check run rather than any one run, so without
#     this event the failing run a since-closed PR earned would remain the most
#     recent run on the commit and would keep its siblings blocked with no
#     blocking label applied anywhere and no automatic way out. Recovery would
#     mean toggling a label or pushing a commit. Re-running the failing run by
#     hand would not always do: a re-run replays its original event, so a run
#     the closed PR's own event fired would read that PR as open again.
#
# The `issues` trigger serves step 1 only.
#
# No checkout: each action runs its own copy of its script, at the commit the
# `uses:` line pins; see .github/workflows/CLAUDE.md.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  administrative-merge-holds:
    name: Administrative merge holds (not failure)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce mutually exclusive label sets
        id: enforce
        if: github.event.action == 'labeled'
        uses: aunger/vcs-automation/enforce-mutually-exclusive-labels@3a677839fad0d24f69887ad547a3f911b9d876e3 # v1.2.0
        with:
          exclusive-sets: |
            [
              ["p1", "p2", "p3"],
              ["verification needed", "verified"],
              ["changes requested", "changes done"],
              ["orchestrate", "orchestrating"],
              ["snooze 3 days", "snooze 7 days", "snooze 14 days", "snooze 30 days", "snooze 90 days", "snooze 180 days"]
            ]
          exclusive-prefixes: |
            ["c-a-", "c-r-", "test-failure"]

      - name: Red to hold merge, not a failure
        if: github.event_name == 'pull_request'
        uses: aunger/vcs-automation/check-blocking-labels@3a677839fad0d24f69887ad547a3f911b9d876e3 # v1.2.0
        with:
          blocking-labels: |
            ["verification needed", "changes requested", "changes done", "orchestrating"]
          # Empty when step 1 was skipped or removed nothing.
          removed-labels: ${{ steps.enforce.outputs.removed }}
