name: Administrative merge holds

# One job, two steps, run in this order:
#
#   1. Enforce mutually exclusive label sets (issues and pull requests,
#      `labeled` only). When a label belonging to a mutually exclusive set is
#      added, removes any other label from the same set, so that at most one
#      member of each set is present at any time. The sets live in
#      scripts/ci/labels/enforce_mutually_exclusive_labels.py
#      (MUTUALLY_EXCLUSIVE_SETS and MUTUALLY_EXCLUSIVE_PREFIXES).
#
#   2. "Red to hold merge, not a failure" (pull requests only). Fails the job,
#      and with it the required status check named after the job, whenever a
#      blocking label is present on any open PR whose head is this commit,
#      preventing merge until the label is removed. The blocking labels live
#      in scripts/ci/labels/check_blocking_labels.py (BLOCKING_LABELS):
#        - verification needed
#        - changes requested
#        - changes done
#        - orchestrating
#
# Enforcement runs first because it can remove a blocking label: adding
# `verified` drops `verification needed`, and adding `orchestrate` drops
# `orchestrating`. A removal made with GITHUB_TOKEN starts no new workflow run,
# so a verdict computed before it would stand until some later event. That is
# also why step 1 reports the labels it removed (its `removed` output), and
# step 2 drops exactly those from the event-payload labels, which were
# captured before step 1 ran. Every other payload label still counts, so the
# label that fired a `labeled` event is never lost to a lagging API read.
#
# A red job therefore means one of two things, told apart by the step icons:
# step 2 red is a deliberate hold; step 1 red is a broken enforcement run,
# which also holds the merge rather than hiding behind a green job (issue
# #1241). Step 2 is skipped after a step 1 failure; the job is red either way.
# One routine way step 1 goes red: on a fork PR, GITHUB_TOKEN is read-only
# whatever `permissions:` asks for, so a removal there fails with a 403 and
# the merge is held until a later event re-runs the job.
# Skipped steps are routine here: step 1 is skipped on every event but
# `labeled`, and step 2 on every issue event.
#
# Step 2 asks its question about the *commit*, not about the PR that fired the
# event, because that is what the answer is stored against: a check run
# attaches to a head commit, and GitHub evaluates a required check by taking
# the most recent run of that check name on that commit, regardless of which
# PR produced it. Reading only the triggering PR's labels therefore let two
# open PRs sharing a head commit answer for each other, and
# agents/pr_verify.md's live-fire recipe manufactured exactly that collision
# on PRs that were mid-verification (issue #833). See
# scripts/ci/labels/check_blocking_labels.py for the full rationale.
#
# Every pull request event that can change a commit's verdict, and that fires
# a run against that commit, is a trigger. Both halves are narrower than "all
# pull_request events", so this list is not the full set and does not keep
# every stored verdict current:
#   - `edited`, `ready_for_review`, `converted_to_draft` and the rest cannot
#     change the verdict, so they are deliberately absent.
#   - A force-push does change the set of PRs at the commit it leaves behind,
#     but the run it fires lands on the pusher's new head, so the abandoned
#     commit keeps the verdict it already had. That is the `closed` case below
#     without an event that can fix it, and it is not addressed here.
#
# The pull request events that are listed:
#   - opened / reopened / synchronize: ensure fresh PRs are blocked from the start.
#   - labeled / unlabeled: re-evaluate immediately when the label changes.
#   - closed: closing a PR removes it from the set the script considers, so
#     closing one can be exactly what unblocks a commit. The gate's observable
#     state is the stored check run rather than any one script run, so without
#     this event the failing run a since-closed PR earned would remain the most
#     recent run on the commit and would keep its siblings blocked with no
#     blocking label applied anywhere and no automatic way out. Recovery would
#     mean re-running the job by hand, toggling a label, or pushing a commit.
#
# The `issues` trigger serves step 1 only.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  administrative-merge-holds:
    name: Administrative merge holds (not failure)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Pinned to a ref the pull request does not control: this job holds
        # write scopes and runs scripts out of this checkout (issue #882).
        # The fallback covers the `issues` event. Rule, rationale and limits:
        # scripts/ci/test_privileged_workflow_checkouts.py.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Enforce mutually exclusive label sets
        id: enforce
        if: github.event.action == 'labeled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ADDED_LABEL: ${{ github.event.label.name }}
        run: python3 scripts/ci/labels/enforce_mutually_exclusive_labels.py

      - name: Red to hold merge, not a failure
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          # Empty when step 1 was skipped or removed nothing.
          REMOVED_LABELS: ${{ steps.enforce.outputs.removed }}
        run: python3 scripts/ci/labels/check_blocking_labels.py
