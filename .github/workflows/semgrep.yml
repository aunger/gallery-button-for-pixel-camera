name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly-published rules.
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Compute scan targets
        id: targets
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGETS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
            if [[ -z "${TARGETS// }" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "targets=." >> "$GITHUB_OUTPUT"
          fi

      - name: Run Semgrep
        id: semgrep
        if: steps.targets.outputs.skip != 'true'
        run: |
          semgrep scan \
            --config p/python \
            --config p/kotlin \
            --config p/security-audit \
            --error \
            --sarif \
            --output semgrep.sarif \
            ${{ steps.targets.outputs.targets }}
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on findings
        if: steps.semgrep.outcome == 'failure'
        run: exit 1
