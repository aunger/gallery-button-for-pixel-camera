name: Reconcile issue labels on open PRs

# On-demand re-application of propagate-issue-labels.yml's label propagation
# rule to every open pull request, through vcs-automation's
# reconcile-issue-labels action. propagate-issue-labels.yml's pull_request
# triggers cover a sidebar-linked PR whenever it sees further ordinary
# activity (a push, a reopen, and so on); this workflow exists for the
# residual case of a PR that gets sidebar-linked and then sees none of those
# events before merge.
#
# Deliberately workflow_dispatch-only rather than a schedule: a periodic
# cron would poll every open PR indefinitely even when nothing needs
# reconciling, for a gap that is otherwise already closed by the pokes in
# propagate-issue-labels.yml. Run this manually from the Actions tab if you
# suspect a PR was sidebar-linked without triggering that workflow.
#
# The three tables are propagate-issue-labels.yml's.
#
# No checkout: the action runs its own copy of the script, at the commit the
# `uses:` line pins.

on:
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile issue labels across open PRs
        uses: aunger/vcs-automation/reconcile-issue-labels@3a677839fad0d24f69887ad547a3f911b9d876e3 # v1.2.0
        with:
          excluded-labels: |
            [
              "orchestrate",
              "orchestrating",
              "verification needed",
              "verified",
              "changes requested",
              "changes done",
              "agents"
            ]
          exclusive-sets: |
            [
              ["p1", "p2", "p3"],
              ["verification needed", "verified"],
              ["changes requested", "changes done"],
              ["orchestrate", "orchestrating"],
              ["snooze 3 days", "snooze 7 days", "snooze 14 days", "snooze 30 days", "snooze 90 days", "snooze 180 days"]
            ]
          exclusive-prefixes: |
            ["c-a-", "c-r-", "test-failure"]
