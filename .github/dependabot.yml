# App-runtime CVE coverage for the dependencies declared directly in
# app/build.gradle.kts (issue #819, a follow-on suggestion from PR #812's
# "Follow-up suggestions" section).
#
# #803 looked at general CVE scanning over the whole resolved dependency
# graph (gradle/verification-metadata.xml, 585 artifacts) and recommended
# against it: none of the 20 flagged artifacts at the time were declared app
# dependencies, all 20 arrived transitively through Gradle/AGP build tooling
# that never ships in the APK, and that toolchain gets its own, narrower
# coverage separately: PR #812 adds a report-only watch
# (scripts/ci/prs-and-issues/watch_toolchain_bump.py) over exactly those
# toolchain coordinates, on top of the manual bump procedure in
# gradle/README.md. #803's conclusion: "If app-runtime CVE coverage is
# wanted, that is Dependabot over app/build.gradle.kts, a separate piece of
# work from this one."
#
# directory is "/app", not "/", so this does not touch the root
# build.gradle.kts toolchain pins (the Gradle/AGP/KGP versions), which
# gradle/README.md documents as deliberately un-automated: any bump there
# also needs a KGP-compatibility-row check, a CodeQL Kotlin ceiling check,
# and a gradle/verification-metadata.xml regeneration, none of which
# Dependabot performs.
#
# That last point still applies within app/: every dependency version bump
# changes which artifacts Gradle resolves, so gradle/verification-metadata.xml
# needs the same manual regeneration (scripts/regenerate-gradle-verification.sh)
# on top of any Dependabot pull request here before its CI can pass. Dependabot
# cannot do that step itself; a human pushes the regenerated file onto the
# Dependabot branch, the same as any other dependency bump in this repo.
#
# Weekly on Monday, offset an hour past dependency-audit.yml's 09:00 UTC
# Monday cron (which is itself offset from semgrep.yml's 08:00), so the three
# don't land in the same CI-minute window.
#
# open-pull-requests-limit and groups (issue #871): the default limit of 5 was fully consumed by test-only bumps (#845 through #849), so no app-runtime bump, the coverage this file exists for, could be proposed until one of those closed.
# Raising the limit to 10 leaves room for both kinds of bump at once.
# The test-dependencies group then collapses every test-only bump into a single pull request, so a run of test-only bumps costs one gradle/verification-metadata.xml regeneration instead of one per package; app-runtime dependencies stay ungrouped, so each keeps its own pull request and review.
#
# The group patterns cover every testImplementation and androidTestImplementation coordinate in app/build.gradle.kts.
# The one exception is androidx.compose:compose-bom, declared identically under both androidTestImplementation and the shipping implementation block; it stays ungrouped and travels with the app-runtime Compose bump instead, since grouping it would fold a shipping dependency into the test group.
# androidx.test* is scoped to the "androidx.test" package prefix, so it does not capture the shipping androidx.core, androidx.lifecycle, androidx.activity, androidx.compose, or androidx.viewpager2 artifacts.

# maven-google (issue #897): without it, this file has never proposed an app-runtime bump and cannot.
# Dependabot resolves versions against the repositories it finds in the files it fetched, and its Gradle file fetcher never walks up out of `directory`, so with "/app" that set is app/build.gradle.kts alone.
# That file declares no `repositories` block and cannot: settings.gradle.kts sets `RepositoriesMode.FAIL_ON_PROJECT_REPOS`, and its `dependencyResolutionManagement { repositories { google() } }` sits outside the fetched directory.
# Finding no repository, Dependabot falls back to its built-in default of Maven Central alone, where every `androidx.*` and `com.google.android.material` coordinate 404s.
# The 2026-08-17 run recorded "No update possible" for twelve Google-hosted coordinates, eleven of them genuinely out of date (compose-bom was twenty months stale), then reported success and opened nothing.
#
# A `maven-repository` registry is added to the repositories Dependabot consults, not substituted for them (that would need `replaces-base`), so Central still serves junit, mockito, robolectric, kotlinx-coroutines-test, org.json and subsampling-scale-image-view.
# The url is exactly https://maven.google.com, the URL Dependabot itself uses when it reads a `google()` declaration, which routes the lookup through its group-index.xml handling for that host rather than a maven-metadata.xml fetch.
# username and password are empty because this repository is public and needs no credentials; they are present because GitHub documents them as the authentication parameters of a `maven-repository` registry, and the empty-string form is the one with evidence of the service accepting it.
# They are not quite inert: Ruby reads an empty string as a username that is present, so Dependabot attaches `Authorization: Basic Og==` (an empty user:password pair) to the maven-metadata.xml and release-date fetches, though not to the group-index version listing, which sends no headers at all.
# Google answers 200 with that header and without it, checked directly and through a full resolution run with cooldown enabled, so it costs nothing today.
# Dropping both keys removes the header and was not done: an unaccepted registry disables this whole file, which is the failure being fixed here, and that is not testable before the change is on the default branch.
#
# Widening `directory` to "/" would also expose google(), since Dependabot does read `dependencyResolutionManagement` from a settings file inside the configured directory, but it was rejected: it pulls the root toolchain pins (AGP, KGP, the Compose plugin) and the e2e modules into scope, which is exactly what #834 scoped this file to "/app" to avoid, and gradle/README.md documents those pins as deliberately un-automated.
#
# Cooldown (issue #897, second half): a version update is held until its release is three days old.
# That is GitHub's default since 2026-07-14 and applies with no `cooldown` key in this file; it does not apply to security updates.
# It is why the 2026-08-17 run logged "No update needed for org.json:json 20260719" against a 20260814 release: that release was 2 days 17 hours old at the time, short of the three-day window by 6 hours.
# A held bump is not a lost one; it is proposed by the next run past the third day.

version: 2
registries:
  maven-google:
    type: maven-repository
    url: https://maven.google.com
    username: ""
    password: ""

updates:
  - package-ecosystem: "gradle"
    directory: "/app"
    registries:
      - maven-google
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      test-dependencies:
        patterns:
          - "junit:junit"
          - "org.mockito*"
          - "org.robolectric*"
          - "androidx.test*"
          - "androidx.compose.ui:ui-test-junit4"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
          - "org.json:json"
