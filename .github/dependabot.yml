# App-runtime CVE coverage for the dependencies declared directly in
# app/build.gradle.kts (issue #819, a follow-on suggestion from PR #812's
# "Follow-up suggestions" section).
#
# #803 looked at general CVE scanning over the whole resolved dependency
# graph (gradle/verification-metadata.xml, 585 artifacts) and recommended
# against it: none of the 20 flagged artifacts at the time were declared app
# dependencies, all 20 arrived transitively through Gradle/AGP build tooling
# that never ships in the APK, and that toolchain gets its own, narrower
# coverage separately: PR #812 adds a report-only watch
# (scripts/ci/prs-and-issues/watch_toolchain_bump.py) over exactly those
# toolchain coordinates, on top of the manual bump procedure in
# gradle/README.md. #803's conclusion: "If app-runtime CVE coverage is
# wanted, that is Dependabot over app/build.gradle.kts, a separate piece of
# work from this one."
#
# directory is "/app", not "/", so this does not touch the root
# build.gradle.kts toolchain pins (the Gradle/AGP/KGP versions), which
# gradle/README.md documents as deliberately un-automated: any bump there
# also needs a KGP-compatibility-row check, a CodeQL Kotlin ceiling check,
# and a gradle/verification-metadata.xml regeneration, none of which
# Dependabot performs.
#
# That last point still applies within app/: every dependency version bump
# changes which artifacts Gradle resolves, so gradle/verification-metadata.xml
# needs the same manual regeneration (scripts/regenerate-gradle-verification.sh)
# on top of any Dependabot pull request here before its CI can pass. Dependabot
# cannot do that step itself; a human pushes the regenerated file onto the
# Dependabot branch, the same as any other dependency bump in this repo.
#
# Weekly on Monday, offset an hour past dependency-audit.yml's 09:00 UTC
# Monday cron (which is itself offset from semgrep.yml's 08:00), so the three
# don't land in the same CI-minute window.
#
# open-pull-requests-limit and groups (issue #871): the default limit of 5 was fully consumed by test-only bumps (#845 through #849), so no app-runtime bump, the coverage this file exists for, could be proposed until one of those closed.
# Raising the limit to 10 leaves room for both kinds of bump at once.
# The test-dependencies group then collapses every test-only bump into a single pull request, so a run of test-only bumps costs one gradle/verification-metadata.xml regeneration instead of one per package; app-runtime dependencies stay ungrouped, so each keeps its own pull request and review.
#
# The group patterns cover every testImplementation and androidTestImplementation coordinate in app/build.gradle.kts.
# The one exception is androidx.compose:compose-bom, declared identically under both androidTestImplementation and the shipping implementation block; it stays ungrouped and travels with the app-runtime Compose bump instead, since grouping it would fold a shipping dependency into the test group.
# androidx.test* is scoped to the "androidx.test" package prefix, so it does not capture the shipping androidx.core, androidx.lifecycle, androidx.activity, androidx.compose, or androidx.viewpager2 artifacts.
#
# What the runs since have shown (issue #873): both keys do what they were added for.
# Grouping: the 2026-08-11 run closed #845 through #849 as superseded by one grouped pull request, #874, and dependabot-verification-metadata-regen.yml then ran once for the whole group instead of once per package.
# The raised limit: the 2026-09-14 run opened #1116 while five pull requests from this entry were already open (#900, #901, #903, #915, #916), and the 2026-09-28 run opened #1186 against five (#900, #915, #916, #1117, #1145).
# GitHub documents the limit as raising no further version-update pull request once that many are open, so a limit of 5 would have held both back.
# Both were test-dependencies group pull requests.
# That a group pull request counts toward the limit like any other is read from that documentation, which makes no exception for groups, rather than observed: the limit is applied by GitHub's service, not by dependabot-core.
#
# scripts/test_dependabot_config.sh guards the property the raise was for rather than any one run's outcome: it counts the pull requests this entry's coordinates can want open at once, one per non-empty group plus one per ungrouped coordinate, and requires the limit to exceed that count.
# It fails at 9 against the default of 5 this file used to inherit, which is the starvation #871 reported, and it fails at 9 against 9 too: a limit equal to the count covers exactly what today's manifest can want and starves the next ungrouped coordinate added to it (issue #937).
# Today's 9 against 10 passes with one slot to spare, so the check goes red on the pull request that adds a tenth ungrouped shipping coordinate rather than on the one after it, and the failure names the limit to raise it to.
# It asserts both directions of the grouping claim above too: every test-only coordinate lands in a group, and no group takes a coordinate that ships in the APK, which is what keeps each app-runtime dependency in a pull request and a review of its own.
# The second half is the load-bearing one for the first check as well as for review: a group of shipping coordinates would collapse them into one pull request, dropping the count that check requires the limit to exceed from 9 to 2.

# maven-google (issue #897): without it, this file has never proposed an app-runtime bump and cannot.
# Dependabot resolves versions against the repositories it finds in the files it fetched, and its Gradle file fetcher never walks up out of `directory`, so with "/app" that set is app/build.gradle.kts alone.
# That file declares no `repositories` block and cannot: settings.gradle.kts sets `RepositoriesMode.FAIL_ON_PROJECT_REPOS`, and its `dependencyResolutionManagement { repositories { google() } }` sits outside the fetched directory.
# Finding no repository, Dependabot falls back to its built-in default of Maven Central alone, where every `androidx.*` and `com.google.android.material` coordinate 404s.
# The 2026-08-17 run recorded "No update possible" for twelve Google-hosted coordinates, eleven of them genuinely out of date (compose-bom was twenty months stale), then reported success and opened nothing.
#
# A `maven-repository` registry is added to the repositories Dependabot consults, not substituted for them (that would need `replaces-base`), so Central still serves junit, mockito, robolectric, kotlinx-coroutines-test, org.json and subsampling-scale-image-view.
# The url is exactly https://maven.google.com, the URL Dependabot itself uses when it reads a `google()` declaration, which routes the lookup through its group-index.xml handling for that host rather than a maven-metadata.xml fetch.
# username and password are empty because this repository is public and needs no credentials; they are present because GitHub documents them as the authentication parameters of a `maven-repository` registry, and the empty-string form is the one with evidence of the service accepting it.
# They are not quite inert: Ruby reads an empty string as a username that is present, so Dependabot attaches `Authorization: Basic Og==` (an empty user:password pair) to the maven-metadata.xml and release-date fetches, though not to the group-index version listing, which sends no headers at all.
# Google answers 200 with that header and without it, checked directly and through a full resolution run with cooldown enabled, so it costs nothing today.
# Dropping both keys removes the header and was not done: an unaccepted registry disables this whole file, which is the failure being fixed here, and that is not testable before the change is on the default branch.
#
# Widening `directory` to "/" would also expose google(), since Dependabot does read `dependencyResolutionManagement` from a settings file inside the configured directory, but it was rejected: it pulls the root toolchain pins (AGP, KGP, the Compose plugin) and the e2e modules into scope, which is exactly what #834 scoped this file to "/app" to avoid, and gradle/README.md documents those pins as deliberately un-automated.
#
# Cooldown (issue #897, second half): a version update is held until its release is three days old.
# That is GitHub's default since 2026-07-14 and applies with no `cooldown` key in this file; it does not apply to security updates.
# It is why the 2026-08-17 run logged "No update needed for org.json:json 20260719" against a 20260814 release: that release was 2 days 17 hours old at the time, short of the three-day window by 6 hours.
# For a Central-hosted coordinate such as org.json:json that is the intended behavior, and a held bump is not a lost one; it is proposed by the next run past the third day.
#
# For a Google-hosted coordinate the same default silently drops the bump instead, which is why `cooldown` is written out below with an `exclude` list (issue #905).
# On https://maven.google.com Dependabot lists versions from group-index.xml, which carries version numbers and no dates, and gets dates from a separate step that reads maven-metadata.xml and records the date of `<latest>` alone.
# That step is dependabot-core's `ReleaseDateExtractor`, which pairs `//metadata/versioning/lastUpdated` with `//metadata/versioning/latest` (gradle/lib/dependabot/gradle/package/release_date_extractor.rb:146).
# A candidate that is not `<latest>` therefore has no date, and cooldown holds an undated release ("Release date not available for version 2.11.0 - filtering out").
# That empties the candidate set, so the run reports success and opens nothing, the same silent shape as #897.
# It hits any Google-hosted coordinate whose newest published version is a prerelease, which AndroidX publishes continuously: androidx.lifecycle 2.11.0 was hidden this way because 2.12.0-alpha01 held `<latest>`.
# It also hits any coordinate an `ignore` rule caps to a version line, since a capped target is by definition not `<latest>`.
#
# The trade being made: cooldown is given up for the twelve Google-hosted coordinates, so an androidx.* or Material release can be proposed the day it is published with no window for a bad release to be noticed first.
# It is kept for the seven Central-hosted ones (junit, org.mockito x2, org.robolectric, org.jetbrains.kotlinx, org.json, com.davemorrissey.labs), where dates resolve correctly and the delay does real work.
# `default-days: 3` is written explicitly and must stay, though omitting it would not turn cooldown off.
# `Dependabot::Job::DEFAULT_COOLDOWN_DAYS` is 3, and `build_cooldown` passes it into `CooldownDefinition#to_options`, which substitutes it wherever the YAML left `default-days` unset, so an exclude-only block still cools down for three days.
# `ReleaseCooldownOptions`' own constructor does default `default_days` to 0, but a `cooldown` block in this file never reaches it that way.
# The reason to write the 3 out: it pins the delay here rather than inheriting GitHub's default, so a change to that default cannot move this repo's cooldown silently.
# The patterns match `group:artifact` through File.fnmatch?, so they are anchored on the group prefix rather than on the substring "androidx": com.davemorrissey.labs:subsampling-scale-image-view-androidx is Central-hosted despite its artifact name and must keep its cooldown.
# Excluding by prefix rather than naming androidx.lifecycle alone also covers the ignore-rule case above for any coordinate the maven-google registry serves.
# scripts/test_dependabot_config.sh asserts both halves of this against the real coordinate list in app/build.gradle.kts.
# Which half a coordinate belongs to is decided by a prefix list in scripts/ci/gradle_coordinates.py, and scripts/ci/test_gradle_coordinates.py asks https://maven.google.com about every declared coordinate and fails on any that list classes differently (issue #914).
# So a Google-hosted dependency outside that list, com.google.firebase for one, fails that test on the pull request that adds it, which names the coordinate; it then needs an entry in that list and a pattern here.
#
# The underlying defect is in dependabot-core, not here.
# Either of two upstream changes would retire this `exclude`: reading a per-version date (the .pom or .module timestamp) instead of only `<latest>`'s lastUpdated, or treating "date unknown" as "not in cooldown".
# The first now exists upstream, and does not reach these coordinates (issue #1073).
# `VersionReleaseDateFallbackFetcher` HEADs the .pom and reads its `Last-Modified`, but `fetch_release_metadata` returns before reaching it unless `plugin?`, which is true only of a requirement in the `plugins` group (gradle/lib/dependabot/gradle/package/package_details_fetcher.rb:152 and :427).
# No coordinate this `exclude` matches is declared in the `plugins` block: they are `implementation`, `debugImplementation` and `*testImplementation` declarations in app/build.gradle.kts, so the fallback never runs for any of them.
# Google is not the side withholding the date: HEAD on the 2.11.0 .pom under https://maven.google.com redirects once to dl.google.com and answers 200 with `Last-Modified: Wed, 17 Jun 2026 17:07:08 GMT`, and Dependabot's Excon stack follows redirects.
# That gate was already in place in 0.392.0, the version #905's reproduction ran, which is why the run still logged "Release date not available for version 2.11.0 - filtering out".
# The second is a request for new behavior, not an appeal to behavior that exists: no `.github/dependabot.yml` can reach it.
# `missing_release_date_in_cooldown?` filters an undated release out whenever cooldown options are present, and passes it only when they are nil (gradle/lib/dependabot/gradle/update_checker/version_finder.rb:252), and a job always has them, because `build_cooldown` returns `ReleaseCooldownOptions.new(default_days: 3)` when this file carries no `cooldown` key at all (updater/lib/dependabot/job.rb:693).
# Deleting the `cooldown` block below therefore does not restore these twelve bumps, it re-hides them, which is #905 verbatim.
# So the `exclude` stays, until dependabot-core ungates that fallback or the Maven ecosystem's ungated equivalent (`fetch_pom_last_modified`, new in v0.393.0 and serving `package-ecosystem: maven`) reaches the Gradle path.

version: 2
registries:
  maven-google:
    type: maven-repository
    url: https://maven.google.com
    username: ""
    password: ""

updates:
  - package-ecosystem: "gradle"
    directory: "/app"
    registries:
      - maven-google
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      exclude:
        - "androidx.*"
        - "com.google.android.material:*"
    groups:
      test-dependencies:
        patterns:
          - "junit:junit"
          - "org.mockito*"
          - "org.robolectric*"
          - "androidx.test*"
          - "androidx.compose.ui:ui-test-junit4"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
          - "org.json:json"

  # GitHub Action pins, which nothing else in this repository watches (issue #1135).
  #
  # directory is "/" because that is where Dependabot looks for workflows: it reads `.github/workflows`, and a root `action.yml`, from there and nowhere else.
  #
  # The two groups split third-party actions from first-party ones, the split agents/code_edit.md draws.
  # A third-party action is pinned to a commit SHA, so its bump rewrites that SHA and the version comment beside it and wants a review of its own; the `actions/` and `github/` namespaces are tag pins, whose bump moves a major tag.
  # The third-party group is `*` minus those two namespaces, so an action a workflow adds later falls into it instead of getting a pull request to itself.
  #
  # No `cooldown` key, unlike the gradle entry above: GitHub's Dependabot options reference does not list github-actions among the ecosystems cooldown supports (checked 2026-09-23).
  # No `open-pull-requests-limit` either: every action is grouped, so this entry wants one pull request per group, and the default of 5 covers that.
  # scripts/test_dependabot_config.sh checks the grouping and the limit against the workflows.
  #
  # 11:00 Monday keeps the run an hour clear of the gradle entry above.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    groups:
      first-party-actions:
        patterns:
          - "actions/*"
          - "github/*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "github/*"

  # The hash-pinned Python locks under scripts/, which nothing else in this repository updates (issue #1191).
  # Without this entry an advisory against a locked package surfaces only as a red pip-audit on whatever pull request runs next, related or not, which is how #1189 reached PR #1188.
  #
  # The ecosystem is "uv", not "pip", because of how the locks are made.
  # Each is `uv pip compile --universal --python-version 3.11 --generate-hashes` output from the sibling `.in` its header names.
  # The pip ecosystem regenerates a compiled lock with pip-tools' `pip-compile`, which takes neither `--universal` nor `--python-version`, so it would re-resolve each lock for the Dependabot runner's own interpreter and drop the marker-gated entries the other install sites need (typing-extensions below Python 3.13 in the audit lock, and pywin32 on Windows in the semgrep lock).
  # The uv ecosystem runs `uv pip compile` instead, reading `--universal`, `--python-version` and `--generate-hashes` back out of the existing lock and restoring its header.
  #
  # It is not quite the regeneration each `.in` file documents, in two ways.
  # It compiles in a scratch directory with paths relative to scripts/, so a Dependabot bump rewrites the body's `# via -r scripts/ci/requirements-semgrep.in` annotations to `# via -r ci/requirements-semgrep.in`, and the next regeneration from the repository root rewrites them back.
  # Nothing reads those lines (scripts/ci/audit_requirements.py skips indented ones), so that is churn and nothing more.
  # And it pins with `-P <package>==<version>` where the `.in` files say `-P <package>`, and uv applies that pin to every fork of a universal resolution, including the Python 3.11 fork that `--python-version 3.11` creates.
  # A package whose new release drops Python 3.11 therefore cannot be moved: uv reports no solution for the 3.11 fork, and a grouped run drops that package from its pull request and logs the error.
  # The locks show where that has happened, as a package pinned at two versions under complementary markers.
  # None does at the 3.11 floor: raising it from 3.10 (issue #1196) collapsed the one such package, rpds-py, and the `ignore` key that named it went with it.
  # A package that crosses the floor for the first time fails the same way before any lock shows the fork; it surfaces as that error in the run log.
  # It is then regenerated by hand with the `.in` files' `-P <package>` command, which keeps both versions, and named in an `ignore` key on this entry, so the gap is written here rather than repeated as a weekly error.
  # pip-audit still reports an advisory against such a package; what is lost is only Dependabot proposing the fix.
  # scripts/test_dependabot_config.sh requires the name-only `ignore` rules to name exactly the packages some lock pins at more than one version, so a rule goes once its fork does.
  # Raising the floor, as #1196 did, collapses the forks the dropped version left, and that check then names the rules to remove.
  #
  # The updater has a second failure, and it is the one the first run showed (issue #1195).
  # scripts/ci/requirements-semgrep.in pins `semgrep` exactly, and semgrep's own requirements cap what it pulls in.
  # semgrep 1.178.0 asks for `pyjwt[crypto]~=2.13.0`, `peewee~=3.14`, `wcmatch~=8.3`, `boltons~=21.0`, `click~=8.4.2`, `exceptiongroup~=1.2.0`, `jsonschema~=4.25.1`, `mcp==1.29.0`, `pywin32==311` on Windows, and the opentelemetry `~=1.37.0` and `~=0.58b0` lines, which in turn hold importlib-metadata, protobuf and wrapt back.
  # The conflicts in the first run's log show the same caps in 1.172.0.
  # A newer release outside a cap has no solution beside that pin, so uv reports `No solution found` for the updater's `-P <package>==<version>` and Dependabot records an update error for the package.
  # That first run, on 2026-09-30, recorded 22 of them and finished red, though it still opened both group pull requests.
  # Nothing in this repository lifts a cap, since the caps are semgrep's own, so each of those packages has an `ignore` rule with a closed range of `versions`.
  # The range starts at the first release Dependabot would try that semgrep's requirements exclude, and ends above the newest release published on 2026-09-30.
  # It is closed on purpose: once the package publishes a version above the range, Dependabot tries it again, and either the bump succeeds (semgrep relaxed its cap) or the update error returns as the reminder to widen the range or drop the rule.
  # An open-ended range such as `>=2.14` would hide the package's updates for good once forgotten.
  # The width follows how fast the line ships: a release line or two above the newest for a slow package, several minors for the opentelemetry lines, through the newest release's major where the cap is a major.
  # `mcp` is pinned exactly by semgrep, so it moves only with semgrep and its range runs through the newest release's major, to `<3`.
  # Dependabot's uv requirement parser splits a `versions` string on commas and requires every clause (`initialize` in python/lib/dependabot/python/requirement.rb, which the uv ecosystem reuses), so `>=2.14, <2.17` is 2.14 up to but excluding 2.17.
  # Dependabot tries a pre-release only for a package the lock pins at one (`wants_prerelease?`, common/lib/dependabot/package/package_latest_version_finder.rb:331), so for a package locked at a final release the first release it would try is a final one.
  # wrapt is locked at 1.17.3, so its `2.0.0rcN` releases, which `wrapt<2.0.0` also excludes, are never tried, and its range starts at `>=2`.
  # The opentelemetry `0.x` packages are locked at the pre-release `0.58b0`, so their bounds carry the suffix (`>=0.59b0, <0.71b0`): a final `0.59` sorts above every `0.59bN`, so `>=0.59` would hide none of them, and `<0.71` would still admit `0.71b0`.
  # A range hides only releases above the version the lock pins.
  # scripts/test_dependabot_config.sh requires that and requires every range to be closed, so a range the lock has reached shows up there as stale.
  # An update error of any other kind stays visible, and none of these packages is in another lock, so the rules hide nothing outside scripts/ci/requirements-semgrep.txt.
  #
  # One more ranged rule, for pydantic-core, has a different reason: it keeps out a pydantic pre-release, where the others work around a semgrep cap.
  # pydantic pins its core exactly (2.13.5 asks for `pydantic-core==2.46.5`), and every pydantic-core release above the 2.46 line, as of 2026-09-30, is one only a pydantic pre-release asks for: 2.47.0 by 2.14.0a1, 2.48.0 by 2.14.0b1, 2.49.0 by 2.14.0b2.
  # They are final releases and pydantic-core is locked at one, so Dependabot tries them, and the resolution for `-P pydantic-core==2.49.0` moves pydantic to 2.14.0b2 rather than failing; that is how #1203 opened.
  # Nothing here asks for a pydantic pre-release, so the rule hides that line, starting at `>=2.47`, above the 2.46 line stable pydantic 2.13 uses.
  # The upper bound does not hold back stable pydantic 2.14.0, whichever core it pairs with.
  # pydantic moves by its own bump, which carries its core with it, and a `versions` rule reaches only the dependency it names: the updater passes it to that dependency's update check alone (updater/lib/dependabot/updater/group_update_creation.rb:551), and drops a dependency from a group change only when every version of it is ignored (updater/lib/dependabot/updater/group_dependency_selector.rb:286).
  # That bump moves the lock into or past the range, and scripts/test_dependabot_config.sh then names the rule as stale on that pull request, which is when it goes.
  # So the width sets only how many more pydantic pre-releases the rule absorbs.
  # Each 2.14 pre-release has taken a new core minor, so `<2.52` absorbs two beyond 2.49; a pre-release past that opens a pull request like #1203 again, the reminder to widen the range or drop the rule.
  # pydantic-core, too, is pinned only in scripts/ci/requirements-semgrep.txt.
  #
  # directory is "/scripts" because the uv file fetcher reads requirement files from the directory it is given and from each directory immediately below it, which covers scripts/, scripts/ci/ and scripts/lint/ in one entry.
  # It pairs a lock with its input by basename (requirements-audit.txt with requirements-audit.in), since the headers name the output with `-o`, a spelling the updater does not match.
  # One entry rather than one per directory also keeps a package that several locks share (requests, urllib3, certifi, idna) moving in all of them in the same pull request.
  #
  # `allow: dependency-type: all` is what lets this entry propose the bump #1189 needed.
  # A package that appears only in a compiled lock, and not in its `.in`, is parsed as indirect, and a version update covers direct dependencies alone unless told otherwise; pyjwt, which semgrep and its mcp dependency pull in, is one of those.
  #
  # The two groups split the `.in` pins from everything they pull in.
  # A direct pin's bump changes a tool's behavior (ruff, semgrep and mdformat can each turn a CI check red) and may need a code change before it can land; a transitive bump rarely does, and it is where an advisory against a lock-only package gets fixed.
  # Kept apart, a tool bump that needs work cannot hold back a fix to a package the `.in` files do not pin.
  # python-transitive is `*` minus the direct pins, so a package a future bump pulls in joins it without an edit here, and the `exclude-patterns` list has to track the `.in` files; scripts/test_dependabot_config.sh checks it does.
  # Names are written PEP 503-normalized (pyyaml, not PyYAML), the form the uv parser gives each dependency and the one that test compares against.
  # Two groups want two pull requests at most, inside the default limit of 5, so there is no `open-pull-requests-limit`.
  #
  # A bump can clear a finding scripts/ci/requirements-audit-ignore.toml tolerates, and the audit then fails on the stale entry until someone deletes it on the Dependabot branch.
  # That is the ignore file's own rule 2 working as intended: the entry's reasoning is re-read before it goes, rather than dropped by automation.
  #
  # No `cooldown` key: GitHub's default three-day cooldown applies, and Dependabot dates each PyPI release by its upload time, so it holds bumps the way it does for the gradle entry's Central-hosted coordinates.
  # 12:00 Monday keeps the run an hour clear of the github-actions entry above.
  - package-ecosystem: "uv"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "UTC"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "boltons"
        versions: [">=22, <27"]
      - dependency-name: "click"
        versions: [">=8.5, <8.7"]
      - dependency-name: "exceptiongroup"
        versions: [">=1.3, <1.5"]
      - dependency-name: "importlib-metadata"
        versions: [">=8.8, <9.3"]
      - dependency-name: "jsonschema"
        versions: [">=4.26, <4.28"]
      - dependency-name: "mcp"
        versions: [">1.29.0, <3"]
      - dependency-name: "opentelemetry-api"
        versions: [">=1.38, <1.50"]
      - dependency-name: "opentelemetry-exporter-otlp-proto-common"
        versions: [">=1.38, <1.50"]
      - dependency-name: "opentelemetry-exporter-otlp-proto-http"
        versions: [">=1.38, <1.50"]
      - dependency-name: "opentelemetry-instrumentation"
        versions: [">=0.59b0, <0.71b0"]
      - dependency-name: "opentelemetry-instrumentation-requests"
        versions: [">=0.59b0, <0.71b0"]
      - dependency-name: "opentelemetry-instrumentation-threading"
        versions: [">=0.59b0, <0.71b0"]
      - dependency-name: "opentelemetry-proto"
        versions: [">=1.38, <1.50"]
      - dependency-name: "opentelemetry-sdk"
